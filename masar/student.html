<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مسار التقدم | مادة العلوم</title><style>*{box-sizing:border-box}body{margin:0;background:#edf4fb;color:#143452;font:700 18px Tahoma,Arial}header{padding:27px 18px;color:white;background:linear-gradient(110deg,#092846,#087e96)}main{max-width:960px;margin:20px auto;padding:0 14px}.card{background:white;padding:23px;margin:15px 0;border-radius:20px;box-shadow:0 5px 22px #154b751b}h1{margin:0;font-size:29px}h2{font-size:22px}p{line-height:1.8}button{padding:15px 20px;background:#126ca0;color:white;border:0;border-radius:12px;font:700 17px Tahoma;cursor:pointer;margin:5px}button:disabled{opacity:.5}button.secondary{background:#e0ebf5;color:#123b60}.hide{display:none!important}.bar{height:14px;background:#dce8f4;border-radius:16px;overflow:hidden}.bar>i{display:block;background:linear-gradient(90deg,#12a987,#2780cb);height:100%}.q{border:1px solid #dbe8f2;padding:15px;border-radius:15px;margin:13px 0}label{display:block;padding:7px;margin:6px 0;border:1px solid #e7eef5;border-radius:9px;font-size:16px}#message{color:#b03442}.hint{color:#576f84;font-size:15px}@media print{body{display:none!important}}</style><header><h1>🧪 مادة العلوم | مسار التقدم</h1><p>استكشف • تعلّم • جرّب • أتقن</p></header><main><section class="card" id="loading"><h2>فتح بطاقة الطالب...</h2><p>يجري التحقق من رمز الدخول.</p></section><section class="card hide" id="home"><h2 id="name"></h2><p id="klass"></p><p class="hint">تظهر هنا الدروس التي فعّلها المعلم فقط. افتح الدرس التفاعلي وتدرّب على كل مهارة؛ تصل نتيجتك إلى المعلم تلقائيًا.</p><div id="list"></div></section><section class="card hide" id="quiz"><button class="secondary" id="back">العودة إلى دروسي</button><h2 id="title"></h2><p id="info"></p><div id="questions"></div><button id="send">إرسال نتيجة التدريب</button><p id="message"></p></section></main><script>
const BASE="https://yqoleecldcvnfdmkqgeq.supabase.co",KEY="sb_publishable_P-wXPFs08V6kTx5FkFZXsA_x-ElUhhd",token=new URLSearchParams(location.search).get("t")||"",H={"apikey":KEY,"Authorization":"Bearer "+KEY,"Content-Type":"application/json"},$=id=>document.getElementById(id);let lessons=[],chosen=null,trainingStartedAt=0;
const Q=[
["الملاحظة والاستنتاج","لون أوراق النبات أصفر. هذه العبارة:",["ملاحظة","استنتاج","فرضية"],0],
["فروع العلم","دراسة حركة كرة على منحدر تتبع:",["الفيزياء","علم الأحياء","علم الأرض"],0],
["صياغة الفرضيات","اختر فرضية قابلة للاختبار:",["النبات جميل","إذا زاد الضوء فقد يزداد نمو النبات","أحب النبات"],1],
["المتغير المستقل والتابع","في تجربة ذوبان السكر، ما المتغير المستقل عند تغيير حرارة الماء؟",["حرارة الماء","زمن الذوبان","لون الكأس"],0],
["الثوابت والمجموعة الضابطة","أي عامل ينبغي تثبيته عند اختبار أثر الحرارة في الذوبان؟",["الحرارة","كمية السكر","زمن الذوبان"],1],
["جمع البيانات وتحليلها","للمقارنة بين تجربتين نقوم بـ:",["تسجيل القياسات ومقارنتها","اختيار النتيجة المفضلة","تجاهل القياسات"],0],
["النظرية والقانون العلمي","القانون العلمي يركز على:",["وصف نمط في الطبيعة","الرأي الشخصي","تفسير كل الأسباب"],0],
["العلم والتقنية","تطبيق المعرفة العلمية لحل مشكلة هو:",["تصميم جهاز لتنقية الماء","التخمين دون اختبار","إهمال النتائج"],0]];
async function rpc(name,p){const r=await fetch(BASE+"/rest/v1/rpc/"+name,{method:"POST",headers:H,body:JSON.stringify(p)});const t=await r.text();let j;try{j=JSON.parse(t)}catch{j={error:t}}if(!r.ok||j.error)throw Error(j.error||j.message||"فشل الاتصال");return j}
const escapeText=s=>String(s??"").replace(/[&<>"]/g,x=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[x]));
async function init(){if(!token||token.length<40)throw Error("يرجى استخدام الباركود الفردي الذي أصدره المعلم.");const d=await rpc("masar_student_home",{p_token:token});lessons=d.lessons||[];$("name").textContent="مرحبًا "+d.name;$("klass").textContent="الفصل "+d.class;$("loading").classList.add("hide");$("home").classList.remove("hide");render()}
const KEYS=["العلم وعملياته","النماذج العلمية","تقويم التفسيرات العلمية","الحركة","القوى والحركة","الشغل والآلات البسيطة","الخواص والتغيرات الفيزيائية","الخواص والتغيرات الكيميائية","تركيب المادة","العناصر والمركبات والمخاليط","الذرات والعناصر","الصخور والمعادن","صفائح الأرض المتحركة","التجوية والتعرية وأثرهما"],TITLES=["العلم وعملياته","النماذج العلمية","تقويم التفسيرات العلمية","الحركة","قوانين نيوتن للحركة","الشغل والآلات البسيطة","الخواص والتغيرات الفيزيائية","الخواص والتغيرات الكيميائية","تركيب المادة","العناصر والمركبات والمخاليط","المعادن - جواهر الأرض","أنواع الصخور","صفائح الأرض المتحركة","التجوية والتعرية وأثرهما"];
function render(){const area=$("list");area.replaceChildren();if(!lessons.length){area.textContent="لم يحدد المعلم دروسك بعد.";return}for(const l of lessons){const idx=Math.max(KEYS.indexOf(l.key),KEYS.indexOf(l.title));const c=document.createElement("div");c.className="card";const title=document.createElement("h2");title.textContent=idx>=0?TITLES[idx]:l.title;c.append(title);if(idx>=0){const a=document.createElement("button");a.textContent="🧪 افتح الدرس التفاعلي (شرح • تجربة • مهارات)";a.onclick=()=>location.href="lessons.html?t="+encodeURIComponent(token)+"&li="+idx;c.append(a)}if(l.title==="العلم وعملياته"){const b=document.createElement("button");b.className="secondary";b.textContent="التقويم السريع";b.onclick=()=>openLesson(l);c.append(b)}area.append(c)}}
function openLesson(l){chosen=l;trainingStartedAt=Date.now();$("home").classList.add("hide");$("quiz").classList.remove("hide");$("title").textContent=l.title;$("info").textContent=l.title==="العلم وعملياته"?"اختبر مهاراتك وأرسل النتيجة للمعلم.":"هذا الدرس مُفعّل لك. أسئلة تقويم المهارات الخاصة به ستُضاف بعد اعتمادها.";const x=$("questions");x.replaceChildren();$("message").textContent="";$("send").disabled=l.title!=="العلم وعملياته";if(l.title!=="العلم وعملياته")return;Q.forEach((q,i)=>{let box=document.createElement("div");box.className="q";let h=document.createElement("strong");h.textContent=(i+1)+". "+q[1];box.append(h);q[2].forEach((answer,j)=>{const label=document.createElement("label");const input=document.createElement("input");input.type="radio";input.name="q"+i;input.value=j;label.append(input,document.createTextNode(" "+answer));box.append(label)});x.append(box)})}
$("back").onclick=()=>{$("quiz").classList.add("hide");$("home").classList.remove("hide")};
$("send").onclick=async()=>{const answers=Q.map((_,i)=>document.querySelector('input[name="q'+i+'"]:checked')?.value);if(answers.some(x=>x===undefined)){$("message").textContent="أجب عن جميع الأسئلة أولًا.";return} $("send").disabled=true;try{for(let i=0;i<Q.length;i++){const q=Q[i];const result=await rpc("masar_student_submit",{p_token:token,p_lesson_key:chosen.key,p_skill_key:q[0],p_skill_title:q[0],p_assessment_kind:"تدريب",p_correct:Number(answers[i])===q[3]?1:0,p_total:1,p_seconds:Math.min(36000,Math.max(0,Math.floor((Date.now()-trainingStartedAt)/1000)))});if(!result.ok)throw Error("لم تحفظ إحدى النتائج")}const correct=answers.filter((x,i)=>Number(x)===Q[i][3]).length;$("message").style.color="#167e64";$("message").textContent="تم إرسال نتيجتك للمعلم: "+correct+" من "+Q.length;}catch(e){$("message").textContent="تعذر إرسال النتائج: "+e.message}finally{$("send").disabled=false}};
init().catch(e=>{$("loading").querySelector("h2").textContent="تعذر الدخول";$("loading").querySelector("p").textContent=e.message});
</script></html>
