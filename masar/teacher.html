<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مسار التقدم | لوحة المعلم</title><style>*{box-sizing:border-box}body{font:700 16px Tahoma,Arial;background:#eff5fb;color:#183d60;margin:0}header{padding:24px;background:linear-gradient(115deg,#112d52,#086da5);color:white}main{max-width:1150px;margin:18px auto;padding:0 15px}.card{background:white;border-radius:20px;padding:20px;margin-bottom:16px;box-shadow:0 5px 20px #082d4b12}.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}button,input,select{font:700 15px Tahoma,Arial;padding:12px;border-radius:11px;border:1px solid #d1dfed}input,select{flex:1;min-width:150px}button{background:#176da4;color:white;cursor:pointer}.secondary{background:#dfeef9;color:#123d60}.hide{display:none!important}table{width:100%;border-collapse:collapse}td,th{border-bottom:1px solid #e2e9f0;padding:9px;text-align:right}small{color:#718292}.nav button{margin:3px}.checkbox{display:inline-flex;padding:8px;border:1px solid #dce6f0;border-radius:11px;margin:4px}.checkbox input{min-width:0}#note{color:#ae3e4c}</style><header><h1>🧑‍🏫 مسار التقدم — لوحة المعلم</h1><p>مادة العلوم | الطلاب المستهدفون والخطة العلاجية</p></header><main><section class="card" id="login"><h2>الدخول الآمن للمعلم</h2><div class="row"><input id="email" type="email" placeholder="البريد الإلكتروني"><input id="password" type="password" placeholder="كلمة المرور"><button id="signin">دخول</button></div></section><section id="panel" class="hide"><div class="card"><div class="row"><strong id="stats">جارٍ التحميل</strong><button class="secondary" id="refresh">تحديث</button><button class="secondary" id="logout">خروج</button></div><p id="note"></p></div><div class="card"><h2>تكليف الدروس (يمكن اختيار عدة دروس)</h2><div class="row"><select id="klass"><option value="">جميع الفصول</option><option>1/1</option><option>2/1</option><option>3/1</option><option>4/1</option></select><select id="studentSelect"><option value="">جميع الطلاب النشطين في الفصل</option></select></div><div id="lessonSelect"></div><div class="row"><button id="activate">تفعيل الدروس المختارة</button><button id="deactivate" class="secondary">إيقاف الدروس المختارة</button></div></div><div class="card"><h2>الطلاب المستهدفون حسب الفصول</h2><div class="row"><label for="studentClassFilter">اختر الفصل:</label><select id="studentClassFilter"><option value="all">جميع الفصول</option><option value="1/1">1/1</option><option value="2/1">2/1</option><option value="3/1">3/1</option><option value="4/1">4/1</option></select><select id="studentStatusFilter"><option value="active">النشطون فقط</option><option value="all">النشطون والمستبعدون</option><option value="inactive">المستبعدون فقط</option></select></div><div id="classSummary" class="row" style="margin:14px 0"></div><div style="overflow:auto"><table><thead><tr><th>الاسم</th><th>الفصل</th><th>الحالة</th><th>إجراء</th></tr></thead><tbody id="students"></tbody></table></div></div><div class="card"><h2>نتائج المهارات</h2><div style="overflow:auto"><table><thead><tr><th>الطالب</th><th>الدرس</th><th>المهارة</th><th>النتيجة</th><th>النوع</th></tr></thead><tbody id="results"></tbody></table></div></div></section></main><script>
const B="https://yqoleecldcvnfdmkqgeq.supabase.co",K="sb_publishable_P-wXPFs08V6kTx5FkFZXsA_x-ElUhhd",$=id=>document.getElementById(id);let jwt="",uid="",students=[],assignments=[],results=[];
const lessons=["العلم وعملياته","النماذج العلمية","تقويم التفسيرات العلمية","الحركة","القوى والحركة","الشغل والآلات البسيطة","الخواص والتغيرات الفيزيائية","الخواص والتغيرات الكيميائية","تركيب المادة","العناصر والمركبات والمخاليط","الذرات والعناصر","الصخور والمعادن","صفائح الأرض المتحركة","التجوية والتعرية وأثرهما"];
async function api(p,method="GET",body=null){let r=await fetch(B+"/rest/v1/"+p,{method,headers:{apikey:K,Authorization:"Bearer "+jwt,"Content-Type":"application/json",Prefer:"return=representation"},body:body?JSON.stringify(body):undefined}),t=await r.text();let j;try{j=JSON.parse(t)}catch{j={message:t}}if(!r.ok)throw Error(j.message||t);return j}
function note(t){$("note").textContent=t}
async function auth(){const r=await fetch(B+"/auth/v1/token?grant_type=password",{method:"POST",headers:{apikey:K,"Content-Type":"application/json"},body:JSON.stringify({email:$("email").value,password:$("password").value})});const j=await r.json();if(!r.ok)throw Error(j.error_description||j.msg||"تعذر الدخول");jwt=j.access_token;uid=j.user.id;const access=await api("masar_teachers?select=user_id&user_id=eq."+uid);if(!access.length)throw Error("هذا الحساب غير مخوّل لإدارة مسار التقدم.");$("login").classList.add("hide");$("panel").classList.remove("hide");await reload()}
async function reload(){students=await api("masar_students?select=id,full_name,class_name,active&order=class_name.asc,full_name.asc");assignments=await api("masar_assignments?select=id,student_id,lesson_key,enabled");results=await api("masar_skill_results?select=student_id,lesson_key,skill_title,correct_count,total_count,assessment_kind&order=recorded_at.desc&limit=300");$("stats").textContent="المسجلون: "+students.length+" | النشطون: "+students.filter(x=>x.active).length+" | التكليفات الفعالة: "+assignments.filter(x=>x.enabled).length+" | النتائج: "+results.length;render()}
function makeCell(tr,content){let td=document.createElement("td");td.textContent=content;tr.append(td);return td}
function render(){const sel=$("studentSelect"),v=sel.value;sel.replaceChildren();sel.add(new Option("جميع الطلاب النشطين في الفصل",""));students.filter(x=>x.active&&(!$("klass").value||x.class_name===$("klass").value)).forEach(x=>sel.add(new Option(x.full_name,x.id)));sel.value=v;const tbody=$("students");tbody.replaceChildren();const filterClass=$("studentClassFilter").value,filterStatus=$("studentStatusFilter").value;const summary=$("classSummary");summary.replaceChildren();for(const cl of ["1/1","2/1","3/1","4/1"]){const n=students.filter(x=>x.class_name===cl&&x.active).length;const chip=document.createElement("button");chip.className="secondary";chip.textContent="الفصل "+cl+" • "+n+" نشط";chip.onclick=()=>{$("studentClassFilter").value=cl;render()};summary.append(chip)}students.filter(x=>(filterClass==="all"||x.class_name===filterClass)&&(filterStatus==="all"||(filterStatus==="active"?x.active:!x.active))).forEach(x=>{let tr=document.createElement("tr");makeCell(tr,x.full_name);makeCell(tr,x.class_name);makeCell(tr,x.active?"نشط":"مستبعد");let td=makeCell(tr,"");let b=document.createElement("button");b.textContent=x.active?"إنهاء الخطة":"إعادة للبرنامج";b.className="secondary";b.onclick=async()=>{if(!confirm("هل تؤكد تعديل حالة الطالب؟"))return;try{await api("masar_students?id=eq."+x.id,"PATCH",{active:!x.active});await reload()}catch(e){note(e.message)}};td.append(b);tbody.append(tr)});const out=$("results");out.replaceChildren();results.slice(0,100).forEach(r=>{const tr=document.createElement("tr");makeCell(tr,students.find(x=>x.id===r.student_id)?.full_name||"—");makeCell(tr,r.lesson_key);makeCell(tr,r.skill_title);makeCell(tr,r.correct_count+"/"+r.total_count);makeCell(tr,r.assessment_kind);out.append(tr)})}
$("klass").onchange=render;$("studentClassFilter").onchange=render;$("studentStatusFilter").onchange=render;
const area=$("lessonSelect");lessons.forEach((l,i)=>{const lab=document.createElement("label");lab.className="checkbox";const c=document.createElement("input");c.type="checkbox";c.value=l;lab.append(c,document.createTextNode(" "+l));area.append(lab)});
async function assign(enable){const keys=[...area.querySelectorAll("input:checked")].map(x=>x.value);const targets=students.filter(x=>x.active&&(!$("klass").value||x.class_name===$("klass").value)&&(!$("studentSelect").value||x.id===$("studentSelect").value));if(!keys.length||!targets.length){note("اختر درسًا واحدًا على الأقل وتأكد من وجود طلاب مستهدفين.");return}try{for(const s of targets)for(const key of keys){const prev=assignments.find(x=>x.student_id===s.id&&x.lesson_key===key);if(prev)await api("masar_assignments?id=eq."+prev.id,"PATCH",{enabled:enable});else if(enable)await api("masar_assignments","POST",{teacher_id:uid,student_id:s.id,lesson_key:key,lesson_title:key,enabled:true})}await reload();note("تم "+(enable?"تفعيل":"إيقاف")+" الدروس المحددة لـ "+targets.length+" طالبًا")}catch(e){note("تعذر الحفظ: "+e.message)}}
$("activate").onclick=()=>assign(true);$("deactivate").onclick=()=>assign(false);
$("signin").onclick=()=>auth().catch(e=>note(e.message));$("refresh").onclick=()=>reload().catch(e=>note(e.message));$("logout").onclick=()=>{jwt="";location.reload()};
</script></html>
