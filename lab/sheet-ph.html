<div class="sheet">

  <section class="half">

      <div><h1>تقرير تجربة: الأحماض والقواعد وقياس pH</h1><small>المختبر الافتراضي الذكي · مدرسة أبي الدرداء المتوسطة</small></div>

<script>
const stops=[[0,'#b3122a'],[2,'#e0302a'],[3,'#ee6a24'],[4,'#f39a1f'],[5,'#f1c21b'],[6,'#c9d422'],[7,'#3fa34d'],[8,'#2a9d8f'],[9,'#2f6fbf'],[10,'#3d4fb0'],[11,'#5b3aa6'],[14,'#5a1f7a']];
const hx=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
function col(ph){for(let i=0;i<stops.length-1;i++){const[a,ca]=stops[i],[b,cb]=stops[i+1];if(ph<=b){const t=(ph-a)/(b-a),A=hx(ca),B=hx(cb);return `rgb(${A.map((v,k)=>Math.round(v+(B[k]-v)*t)).join(',')})`;}}}
const scale=Array.from({length:15},(_,i)=>`<span style="background:${col(i)}">${i}</span>`).join('');
const t=document.getElementById('t').innerHTML.replace('SCALE',scale);
const sh=document.querySelector('.sheet');sh.insertAdjacentHTML('afterbegin',t+t);
</script>
