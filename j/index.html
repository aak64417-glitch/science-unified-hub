<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>فتح رحلة عالم العلوم</title>
<meta name="robots" content="noindex">
</head>
<body>
<script>
(function(){
  const p=new URLSearchParams(location.search);
  const task=(p.get('t')||p.get('task')||'').trim();
  const target=new URL('../journey/',location.href);
  if(task) target.searchParams.set('task',task);
  location.replace(target.href);
})();
</script>
<noscript>يرجى تفعيل JavaScript لفتح النشاط.</noscript>
</body>
</html>
