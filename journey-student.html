<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07111f">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>رحلة عالم العلوم | منصة الطالب</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07111f;font-family:Tahoma,Arial,sans-serif}
#studentFrame{position:fixed;inset:0;width:100%;height:100%;border:0;background:#07111f;visibility:hidden}
#gate{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;background:
radial-gradient(circle at 15% 0%,rgba(129,144,255,.20),transparent 35%),
radial-gradient(circle at 90% 10%,rgba(66,222,212,.14),transparent 30%),
#07111f;color:#f7fbff;text-align:center;padding:22px;box-sizing:border-box}
.card{width:min(520px,92vw);padding:30px 24px;border-radius:24px;
background:linear-gradient(180deg,#102039,#0a192b);border:1px solid rgba(255,255,255,.12);
box-shadow:0 24px 70px rgba(0,0,0,.30)}
.logo{width:68px;height:68px;margin:0 auto 16px;border-radius:22px;display:grid;place-items:center;
font-size:34px;background:linear-gradient(135deg,#42ded4,#8190ff)}
h1{font-size:1.35rem;margin:0 0 10px}p{margin:0;color:#b9c9d9;line-height:1.85}
.loader{width:42px;height:42px;margin:20px auto 0;border:4px solid rgba(255,255,255,.14);
border-top-color:#42ded4;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="gate">
 <div class="card">
   <div class="logo">🧪</div>
   <h1>رحلة عالم العلوم</h1>
   <p id="gateText">جاري تحميل النشاط المخصص للطالب والتحقق من الفصل...</p>
   <div class="loader"></div>
 </div>
</div>

<iframe id="studentFrame" title="منصة الطالب" referrerpolicy="same-origin"></iframe>

<script>
(function(){
  const gate = document.getElementById('gate');
  const gateText = document.getElementById('gateText');
  const frame = document.getElementById('studentFrame');
  const params = new URLSearchParams(location.search);
  const taskId = params.get('task');
  const target = 'student_final.html' + location.search + location.hash;

  let revealed = false;
  let timer = null;
  let attempts = 0;

  function reveal(message){
    if(revealed) return;
    revealed = true;
    if(message) gateText.textContent = message;
    frame.style.visibility = 'visible';
    gate.style.display = 'none';
    if(timer) clearInterval(timer);
  }

  function secureChild(){
    let doc;
    try{
      doc = frame.contentDocument || frame.contentWindow.document;
    }catch(e){
      reveal();
      return;
    }
    if(!doc) return;

    // حماية إضافية: لا تظهر أي روابط إدارية حتى لو أضيفت إلى النسخة الداخلية مستقبلًا.
    doc.querySelectorAll('a[href="index.html"],a[href*="journey-teacher"],a[href*="teacher.html"],a[href*="teacher_"]')
      .forEach(el => el.remove());

    // التكليفات المرسلة برابط يجب أن تُقفل على الفصل المحفوظ داخل التكليف.
    if(taskId){
      const classSelect = doc.getElementById('studentClass');
      if(classSelect && classSelect.value && classSelect.value !== 'الكل'){
        const lockedClass = classSelect.value;

        // إزالة كل الفصول الأخرى من الواجهة.
        [...classSelect.options].forEach(opt=>{
          if(opt.value !== lockedClass) opt.remove();
        });
        classSelect.value = lockedClass;
        classSelect.disabled = true;
        classSelect.setAttribute('aria-disabled','true');
        classSelect.style.pointerEvents = 'none';
        classSelect.style.opacity = '1';

        // إضافة بيان واضح للطالب.
        const label = classSelect.closest('.field')?.querySelector('label');
        if(label) label.textContent = 'الفصل المخصص لهذا النشاط';

        reveal();
        return;
      }
    }else{
      // فتح المنصة دون رابط تكليف: لا حاجة لقفل فصل.
      reveal();
      return;
    }

    attempts++;
    // مهلة احتياطية حتى تظهر رسالة الخطأ الأصلية إذا كان التكليف متوقفًا/غير صالح.
    if(attempts >= 60) reveal();
  }

  frame.addEventListener('load', function(){
    attempts = 0;
    secureChild();
    timer = setInterval(secureChild, 200);
  });

  // يمنع فتح أي عنوان إداري من الإطار في النافذة العليا.
  window.addEventListener('message', function(){}, false);

  frame.src = target;
})();
</script>
</body>
</html>
