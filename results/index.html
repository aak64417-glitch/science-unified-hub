<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>منصة تحليل نتائج الاختبارات | أبي الدرداء المتوسطة</title>
<link rel="icon" href="../icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--navy:#0a2a5e;--navy2:#123f8c;--blue:#1d6fe0;--gold:#f2c14e;--gold2:#ffe08a;--bg:#eef3fa;--card:#fff;--line:#dfe7f3;--ink:#0d2346;--muted:#4f5f7c;--ok:#22a45d;--bad:#e5484d;--warn:#f59e0b;--r:18px}
*{box-sizing:border-box}
svg text{font-family:'Tajawal',Tahoma,sans-serif}
html,body{margin:0}
body{font-family:'Tajawal',Tahoma,'Segoe UI',Arial,sans-serif;font-weight:700;color:var(--ink);background:var(--bg);min-height:100vh}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:
 radial-gradient(1200px 380px at 70% -120px,#dbe7fb 0,transparent 70%),
 linear-gradient(170deg,transparent 78%,#e6c46a22 78.3%,transparent 80%),
 linear-gradient(180deg,#f5f8fd,#eaf0f9)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
/* ===== sidebar ===== */
.side{background:linear-gradient(185deg,#0b3170 0%,#0a2a5e 55%,#081f47 100%);color:#fff;padding:22px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px;overflow:auto}
.moe{text-align:center;padding:6px 0 18px;border-bottom:1px solid #ffffff22;margin-bottom:12px}
.moe .dots{display:flex;justify-content:center;gap:4px;margin-bottom:8px}
.moe .dots i{width:7px;height:7px;border-radius:2px;background:#7fd6e6;opacity:.9}
.moe .dots i:nth-child(even){background:#cfe9f0}
.moe b{display:block;font-size:22px;font-weight:900}
.moe small{font-size:11px;color:#c9d7ee;letter-spacing:.3px}
.nav-btn{display:flex;align-items:center;gap:12px;width:100%;border:0;background:transparent;color:#fff;padding:13px 14px;border-radius:14px;font-size:16.5px;font-weight:800;text-align:right;transition:.18s}
.nav-btn svg{width:24px;height:24px;flex:none}
.nav-btn:hover{background:#ffffff14}
.nav-btn.active{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#0a2a5e;box-shadow:0 8px 18px #0004}
.side .store{margin-top:auto;font-size:12.5px;color:#c9d7ee;line-height:1.8;background:#ffffff10;border:1px solid #ffffff22;border-radius:14px;padding:10px 12px}
.side .store b{color:var(--gold2)}
/* ===== main ===== */
.main{padding:18px 22px 40px;min-width:0}
.top{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center;margin-bottom:16px}
.title{background:linear-gradient(135deg,#0b3170,#163f8d);color:#fff;border-radius:22px;padding:14px 24px;display:flex;align-items:center;gap:14px;box-shadow:0 12px 26px #0a2a5e33;position:relative;overflow:hidden}
.title::after{content:"";position:absolute;inset:auto -40px -40px auto;width:220px;height:80px;background:linear-gradient(90deg,transparent,#f2c14e55);transform:rotate(-8deg)}
.title svg{width:42px;height:42px;flex:none}
.title h1{margin:0;font-size:clamp(20px,2.4vw,30px);font-weight:900}
.title p{margin:2px 0 0;color:#dbe7ff;font-size:14.5px;font-weight:700}
.school{background:#fff;border:1px solid var(--line);border-radius:20px;padding:10px 16px;display:flex;align-items:center;gap:12px;box-shadow:0 8px 20px #0a2a5e12;min-width:240px}
.school img{width:58px;height:58px;object-fit:contain}
.school b{display:block;font-size:16.5px;font-weight:900}
.school small{color:var(--muted);font-size:13px}
/* filters */
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:16px;padding:10px 12px;margin-bottom:14px}
.filters label{font-size:13.5px;color:var(--muted)}
.sel,.inp{border:1.5px solid var(--line);background:#f8fbff;border-radius:11px;padding:8px 10px;font-weight:700;min-height:40px}
.sel:focus,.inp:focus{outline:2px solid #1d6fe055;border-color:var(--blue)}
textarea.inp{width:100%;min-height:150px;resize:vertical;direction:rtl}
/* type tiles */
.types{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:16px}
.tile{border:0;border-radius:20px;color:#fff;padding:18px 10px 14px;display:flex;flex-direction:column;align-items:center;gap:8px;box-shadow:0 10px 20px #0a2a5e22;position:relative;transition:.18s;font-size:17px;font-weight:900}
.tile svg{width:44px;height:44px}
.tile:hover{transform:translateY(-3px)}
.tile .cnt{position:absolute;top:8px;left:10px;background:#ffffff30;border-radius:20px;padding:1px 9px;font-size:12.5px}
.tile.on{outline:4px solid var(--gold);outline-offset:2px}
/* kpi */
.kpis{display:grid;grid-template-columns:repeat(4,1fr) 1.55fr;gap:14px;margin-bottom:16px}
.kpi{border-radius:18px;padding:14px 10px;text-align:center;border:1px solid}
.kpi svg{width:40px;height:40px}
.kpi b{display:block;font-size:30px;font-weight:900;line-height:1.2;margin-top:4px;direction:ltr}
.kpi span{font-size:15px;color:var(--ink)}
.k1{background:#eef5ff;border-color:#cfe0fb;color:#1d6fe0}.k2{background:#ecf8ef;border-color:#c7ebd2;color:#22a45d}.k3{background:#fff4e6;border-color:#fbdcb1;color:#f08c00}.k4{background:#f3eefe;border-color:#dccff9;color:#7c4ddb}
.banner{background:linear-gradient(135deg,#fff,#eef4fd);border:1px solid #d5e2f6;border-radius:18px;display:flex;align-items:center;justify-content:center;gap:16px;padding:10px 16px;position:relative;overflow:hidden}
.banner::after{content:"";position:absolute;left:-30px;right:-30px;bottom:-26px;height:40px;background:linear-gradient(90deg,#0b3170,#f2c14e);transform:rotate(-3deg);opacity:.9}
.banner .medal{width:70px;height:70px;flex:none}
.banner h3{margin:0;font-size:clamp(22px,2.4vw,32px);font-weight:900;color:#0a2a5e}
.banner p{margin:2px 0 8px;font-size:16px}
/* panels */
.grid3{display:grid;grid-template-columns:1fr 1.3fr 1fr;gap:14px;margin-bottom:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px}
.panel{background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:0 8px 18px #0a2a5e0d;min-width:0}
.ph{background:linear-gradient(135deg,#0b3170,#143f8b);color:#fff;padding:11px 16px;display:flex;align-items:center;gap:10px;font-size:17px;font-weight:900}
.ph svg{width:24px;height:24px}
.ph .act{margin-right:auto;display:flex;gap:6px}
.pb{padding:14px}
.legend{display:flex;flex-direction:column;gap:8px;font-size:15px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-left:7px;vertical-align:middle}
.flex{display:flex;align-items:center;gap:12px}
.center{display:flex;justify-content:center;align-items:center;gap:16px;flex-wrap:wrap}
table{width:100%;border-collapse:collapse;font-size:14.5px}
th{background:#f1f5fb;color:#24395e;font-weight:900;padding:9px 8px;border-bottom:1px solid var(--line);text-align:center}
td{padding:8px;border-bottom:1px solid #edf2f9;text-align:center}
td.nm{text-align:right}
.tag{display:inline-block;border-radius:20px;padding:3px 12px;font-size:13px;font-weight:800;border:1px solid}
.t-red{background:#fdecec;color:#c22f34;border-color:#f6c4c5}.t-org{background:#fff3e2;color:#b96a00;border-color:#fbd9a5}.t-grn{background:#e9f8ee;color:#1b8a4b;border-color:#bfe8cd}.t-blu{background:#eaf2ff;color:#1d5fc9;border-color:#c6dafb}.t-pur{background:#f2ecff;color:#6a3fd0;border-color:#d9cbfb}.t-gry{background:#f1f3f7;color:#55627a;border-color:#dde2ea}
.btn{border:0;border-radius:12px;padding:10px 16px;font-weight:900;display:inline-flex;align-items:center;gap:8px;font-size:15px;transition:.15s;white-space:nowrap}
.btn svg{width:19px;height:19px}
.btn:hover{filter:brightness(1.07);transform:translateY(-1px)}
.b-blue{background:linear-gradient(135deg,#2b7cf0,#1553c4);color:#fff}
.b-green{background:linear-gradient(135deg,#2fbf62,#1b8a4b);color:#fff}
.b-gold{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#0a2a5e}
.b-navy{background:linear-gradient(135deg,#143f8b,#0a2a5e);color:#fff}
.b-light{background:#eef3fa;color:#0a2a5e;border:1px solid var(--line)}
.b-red{background:#fdecec;color:#c22f34;border:1px solid #f6c4c5}
.b-sm{padding:6px 11px;font-size:13.5px;border-radius:10px}
.reports{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.rcard{border-radius:16px;padding:16px;text-align:center;border:1.5px solid}
.rcard svg.big{width:46px;height:46px}
.rcard h4{margin:4px 0;font-size:19px;font-weight:900}
.rcard p{margin:0 0 12px;font-size:14.5px;color:var(--muted);line-height:1.7}
.rc1{background:#eef5ff;border-color:#bcd4fa}.rc2{background:#ecf8ef;border-color:#b8e3c6}
.empty{text-align:center;color:var(--muted);padding:26px 12px;font-size:15.5px;line-height:1.9}
.empty svg{width:52px;height:52px;opacity:.5}
/* tests list */
.tests{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.tcard{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 8px 18px #0a2a5e0d;display:flex;flex-direction:column}
.tcard .tt{color:#fff;padding:12px 14px;display:flex;align-items:center;gap:10px}
.tcard .tt svg{width:28px;height:28px}
.tcard .tt b{font-size:17px;font-weight:900;display:block}
.tcard .tt small{opacity:.9;font-size:13px}
.tcard .tb{padding:12px 14px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.tcard .tb div{background:#f6f9fd;border-radius:12px;padding:8px 4px;font-size:12.5px;color:var(--muted)}
.tcard .tb b{display:block;font-size:19px;color:var(--ink);direction:ltr}
.tcard .tf{padding:0 14px 14px;display:flex;flex-wrap:wrap;gap:6px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.toolbar h2{margin:0 0 0 auto;font-size:22px;font-weight:900}
/* entry */
.entry-wrap{overflow:auto;max-height:66vh;border:1px solid var(--line);border-radius:14px;background:#fff}
.entry th{position:sticky;top:0;z-index:2}
.entry td{padding:4px}
.entry input[type=text],.entry input[type=number]{width:100%;border:1px solid #e3eaf5;border-radius:8px;padding:6px;background:#fbfdff;text-align:center;font-weight:700}
.entry input.name{text-align:right;min-width:190px}
.entry input.q{width:54px}
.entry select{border:1px solid #e3eaf5;border-radius:8px;padding:6px;background:#fbfdff}
.entry tr.abs input{opacity:.45}
.entry .tot{font-weight:900;font-size:15px;direction:ltr}
/* stats grid */
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.stat{background:#f6f9fd;border:1px solid #e4ecf7;border-radius:14px;padding:10px;text-align:center}
.stat small{display:block;color:var(--muted);font-size:13px}
.stat b{font-size:22px;font-weight:900;direction:ltr;display:block}
.step{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:900;color:#0a2a5e;margin:16px 0 10px}
.step:first-child{margin-top:0}
.step .sn{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--gold2),var(--gold));display:grid;place-items:center;font-size:15px;flex:none}
.typepick{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.tp input{position:absolute;opacity:0;pointer-events:none}
.tp span{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px;border-radius:14px;background:#f1f5fb;border:2px solid var(--line);color:#24395e;font-weight:900;font-size:14px;cursor:pointer;text-align:center;transition:.15s}
.tp span svg{width:30px;height:30px}
.tp input:checked+span{background:var(--g);color:#fff;border-color:transparent;box-shadow:0 8px 16px #0a2a5e33;transform:translateY(-2px)}
.tp input:focus-visible+span{outline:3px solid #1d6fe055}
.attach{display:flex;align-items:center;justify-content:center;gap:10px;border:2px dashed #9fb8de;background:#f5f9ff;border-radius:16px;padding:18px;cursor:pointer;color:#1d4f9e;font-weight:900;font-size:16px}
.attach svg{width:28px;height:28px}.attach.on{border-color:#22a45d;background:#ecf8ef;color:#1b8a4b}
.qdet{margin-top:16px;border:1px solid var(--line);border-radius:14px;padding:10px 14px;background:#fbfdff}
.qdet summary{cursor:pointer;font-weight:900;color:#24395e}
.form small{font-weight:700}
@media(max-width:700px){.typepick{grid-template-columns:repeat(3,1fr)}}
.addopts{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.addopt{border:2px dashed color-mix(in srgb,var(--c) 45%,#fff);background:color-mix(in srgb,var(--c) 7%,#fff);border-radius:18px;padding:20px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;color:var(--c);transition:.15s;text-align:center}
.addopt:hover{transform:translateY(-2px);background:color-mix(in srgb,var(--c) 13%,#fff)}
.addopt svg{width:44px;height:44px}.addopt b{font-size:18px;font-weight:900}.addopt span{font-size:13px;color:var(--muted)}
.drag{outline:3px dashed #1d6fe0;outline-offset:4px}
@media(max-width:700px){.addopts{grid-template-columns:1fr 1fr}}
.recs{display:flex;flex-direction:column;gap:10px}
.rec{display:flex;gap:12px;align-items:flex-start;border-radius:14px;padding:12px 14px;border:1px solid;line-height:1.8;font-size:15px}
.rec .ic{font-size:22px;line-height:1.2}
.rec b{display:block;font-size:16px}
.p-high{background:#fff3f3;border-color:#f6caca}.p-mid{background:#fff8ec;border-color:#f8dfae}.p-low{background:#eef8f1;border-color:#c5e8d1}.p-info{background:#eef5ff;border-color:#cbdcf8}
.bar-row{display:grid;grid-template-columns:150px 1fr 56px;gap:10px;align-items:center;margin:7px 0;font-size:14.5px}
.bar-row .tr{background:#edf2f9;border-radius:20px;height:16px;overflow:hidden}
.bar-row .fl{height:100%;border-radius:20px}
.bar-row b{direction:ltr;text-align:left}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:20px;padding:6px 14px;font-weight:800;font-size:14px}
.chip.on{background:#0a2a5e;color:#fff;border-color:#0a2a5e}
/* modal */
.ov{position:fixed;inset:0;background:#06173acc;z-index:50;display:none;align-items:flex-start;justify-content:center;padding:24px 12px;overflow:auto}
.ov.show{display:flex}
.modal{background:#fff;border-radius:22px;width:min(860px,100%);box-shadow:0 30px 70px #0008;overflow:hidden}
.modal .mh{background:linear-gradient(135deg,#0b3170,#143f8b);color:#fff;padding:14px 18px;display:flex;align-items:center;gap:10px;font-size:19px;font-weight:900}
.modal .mh button{margin-right:auto;background:#ffffff22;border:0;color:#fff;width:36px;height:36px;border-radius:50%;font-size:20px}
.modal .mb{padding:18px}
.modal .mf{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-start;flex-wrap:wrap;background:#f8fbff}
.form{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.form .f{display:flex;flex-direction:column;gap:5px;font-size:14px;color:var(--muted)}
.form .f.w2{grid-column:span 2}.form .f.w4{grid-column:1/-1}
.form .inp,.form .sel{color:var(--ink);width:100%}
.secs{display:flex;flex-wrap:wrap;gap:6px}
.secs label{border:1.5px solid var(--line);border-radius:10px;padding:6px 10px;display:flex;gap:6px;align-items:center;color:var(--ink);cursor:pointer}
.secs input{accent-color:#0a2a5e}
.note{background:#fff8e6;border:1px solid #f6dea0;border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.8;color:#6d5208}
.note.blue{background:#eef5ff;border-color:#cbdcf8;color:#1f3f75}
.qtbl input{width:100%;border:1px solid #e3eaf5;border-radius:8px;padding:6px;text-align:center}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(30px);background:#0a2a5e;color:#fff;padding:12px 20px;border-radius:14px;font-weight:800;opacity:0;transition:.25s;z-index:99;box-shadow:0 10px 30px #0006}
.toast.show{opacity:1;transform:translateX(-50%)}
.hide{display:none!important}
.muted{color:var(--muted)}
.help h3{margin:18px 0 6px;font-size:18px;font-weight:900;color:#0a2a5e}
.help p,.help li{line-height:2;font-size:15.5px}
/* ===== report ===== */
#rpOv{position:fixed;inset:0;background:#3b4558;z-index:60;overflow:auto;display:none}
#rpOv.show{display:block}
.rp-bar{position:sticky;top:0;z-index:2;background:#0a2a5e;color:#fff;display:flex;gap:8px;align-items:center;padding:10px 14px;flex-wrap:wrap}
.rp-bar b{margin-left:auto;font-size:16px}
.rp{width:210mm;min-height:297mm;margin:16px auto;background:#fff;padding:12mm 12mm 10mm;box-shadow:0 10px 30px #0006;font-size:12.5px;color:#0d2346;position:relative}
.rp-h{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;border-bottom:3px solid #0a2a5e;padding-bottom:8px;margin-bottom:10px}
.rp-h .r{font-size:12.5px;line-height:1.7}
.rp-h .l{text-align:left;font-size:12.5px;line-height:1.7}
.rp-h img{width:64px;height:64px;object-fit:contain}
.rp-t{background:linear-gradient(135deg,#0b3170,#143f8b);color:#fff;border-radius:12px;padding:9px 14px;text-align:center;margin-bottom:10px;position:relative;overflow:hidden}
.rp-t h2{margin:0;font-size:19px;font-weight:900}
.rp-t p{margin:2px 0 0;font-size:12.5px;color:#dbe7ff}
.rp-t .badge{position:absolute;top:8px;left:10px;background:var(--gold);color:#0a2a5e;border-radius:20px;padding:2px 10px;font-size:11px;font-weight:900}
.rp-info{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}
.rp-info div{background:#f3f7fc;border:1px solid #dfe7f3;border-radius:8px;padding:5px 8px;font-size:11.5px}
.rp-info b{display:block;font-size:13px}
.rp-k{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-bottom:10px}
.rp-k div{border-radius:10px;padding:7px 4px;text-align:center;border:1px solid}
.rp-k b{display:block;font-size:19px;font-weight:900;direction:ltr}
.rp-k span{font-size:11px}
.rp-sec{margin-bottom:10px;break-inside:avoid}
.rp-sec h3{margin:0 0 6px;font-size:14px;font-weight:900;color:#0a2a5e;border-right:5px solid var(--gold);padding-right:8px;background:#f3f7fc;border-radius:6px;padding:5px 8px}
.rp table{font-size:11.5px}
.rp th{padding:5px 4px;background:#0a2a5e;color:#fff;border:1px solid #0a2a5e}
.rp td{padding:4px;border:1px solid #dfe7f3}
.rp tr:nth-child(even) td{background:#f8fbff}
.rp .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rp .rec{font-size:11.5px;padding:7px 9px;line-height:1.7;gap:8px;margin-bottom:5px}
.rp .rec b{font-size:12.5px}
.rp .rec .ic{font-size:16px}
.rp .bar-row{grid-template-columns:110px 1fr 44px;font-size:11.5px;margin:4px 0}
.rp .bar-row .tr{height:11px}
.rp-sign{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px;text-align:center;font-size:12.5px}
.rp-sign div{border-top:1.5px dashed #9fb1cc;padding-top:6px}
.rp-foot{position:absolute;bottom:5mm;left:12mm;right:12mm;display:flex;justify-content:space-between;font-size:10px;color:#6b7a94;border-top:1px solid #e3eaf5;padding-top:3px}
@media print{
 @page{size:A4;margin:0}
 body{background:#fff}
 body::before{display:none}
 body>*:not(#rpOv){display:none!important}
 #rpOv{position:static;display:block!important;background:#fff;overflow:visible}
 .rp-bar{display:none!important}
 .rp{margin:0;box-shadow:none;page-break-after:always;min-height:297mm}
 .rp:last-child{page-break-after:auto}
 *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}
}
/* responsive */

const num=v=>{if(v===''||v==null)return null;const x=parseFloat(toEn(v).replace(',','.'));return isNaN(x)?null:x};
const r1=x=>Math.round(x*10)/10;
const fmt=x=>x==null||isNaN(x)?'—':(Math.round(x*10)/10).toString();

/* ---------- analysis core ---------- */
function stScore(s,t){
 if(s.absent)return null;
 if(t.questions.length&&Array.isArray(s.ans)&&s.ans.some(v=>v!==''&&v!=null)){
  return s.ans.reduce((a,v)=>a+(num(v)||0),0);
 }
 return num(s.score);
}
function stPct(s,t){const sc=stScore(s,t);if(sc==null||!t.total)return null;return Math.max(0,Math.min(100,sc/t.total*100))}
function levels(){return [...S.settings.levels].sort((a,b)=>b.min-a.min)}
function levelOf(p){return levels().find(l=>p>=l.min)||levels()[levels().length-1]}
function stats(arr){
 const a=[...arr].sort((x,y)=>x-y),n=a.length;if(!n)return null;
 const mean=a.reduce((x,y)=>x+y,0)/n;
 const med=n%2?a[(n-1)/2]:(a[n/2-1]+a[n/2])/2;
 const sd=Math.sqrt(a.reduce((x,y)=>x+(y-mean)**2,0)/n);
 return{n,mean,med,sd,min:a[0],max:a[n-1],range:a[n-1]-a[0]};
}
function analyze(t,sec='all'){
 const all=t.students.filter(s=>sec==='all'||String(s.section)===String(sec));
 const rows=[];let absent=0;
 all.forEach(s=>{const p=stPct(s,t);if(p==null){absent++;return}rows.push({s,p,sc:stScore(s,t),lv:levelOf(p)})});
 rows.sort((a,b)=>b.p-a.p);
 const ps=rows.map(r=>r.p);const st=stats(ps);
 const pass=t.pass??50;
 const passN=rows.filter(r=>r.p>=pass).length;
 const lv=levels().map(l=>({...l,count:rows.filter(r=>r.lv.n===l.n).length}));
 const bins=[[0,49.999,'أقل من 50'],[50,59.999,'50 – 59'],[60,69.999,'60 – 69'],[70,79.999,'70 – 79'],[80,89.999,'80 – 89'],[90,100,'90 – 100']].map(b=>({l:b[2],count:ps.filter(p=>p>=b[0]&&p<=b[1]).length}));
 const secs=(sec==='all'?t.sections:[sec]).map(x=>{
  const rr=t.students.filter(s=>String(s.section)===String(x)).map(s=>stPct(s,t)).filter(p=>p!=null);
  const ss=stats(rr);return{sec:x,n:rr.length,mean:ss?ss.mean:null,pass:rr.length?rr.filter(p=>p>=pass).length/rr.length*100:null,max:ss?ss.max:null,min:ss?ss.min:null};
 }).filter(x=>x.n);
 // item analysis
 let items=[];
 if(t.questions.length){
  const withAns=rows.filter(r=>Array.isArray(r.s.ans)&&r.s.ans.some(v=>v!==''&&v!=null));
  const k=Math.max(1,Math.round(withAns.length*0.27));
  const up=withAns.slice(0,k),lo=withAns.slice(-k);
  items=t.questions.map((q,i)=>{
   const m=num(q.mark)||1;
   const vals=withAns.map(r=>num(r.s.ans[i])||0);
   if(!vals.length)return{...q,i,p:null,d:null};
   const p=vals.reduce((a,b)=>a+b,0)/vals.length/m;
   const mu=up.reduce((a,r)=>a+(num(r.s.ans[i])||0),0)/up.length/m;
   const ml=lo.reduce((a,r)=>a+(num(r.s.ans[i])||0),0)/lo.length/m;
   return{...q,i,p,d:withAns.length>=6?mu-ml:null};
  });
 }
 const skMap={};
 items.forEach(it=>{if(it.p==null)return;const k=(it.skill||'').trim();if(!k)return;(skMap[k]=skMap[k]||{sum:0,max:0});const m=num(it.mark)||1;skMap[k].sum+=it.p*m;skMap[k].max+=m});
 const skills=Object.entries(skMap).map(([k,v])=>({skill:k,pct:v.sum/v.max*100})).sort((a,b)=>a.pct-b.pct);
 return{t,sec,rows,absent,total:all.length,st,pass,passN,failN:rows.length-passN,passRate:rows.length?passN/rows.length*100:null,lv,bins,secs,items,skills};
}
function perfLabel(pr){

 return{h:'أداء يحتاج تدخلًا',p:'يلزم تنفيذ خطة علاجية عاجلة',c:'#e5484d'};
}

 if(A.secs.length>1){const s=[...A.secs].sort((a,b)=>b.mean-a.mean);const gap=s[0].mean-s[s.length-1].mean;
  if(gap>=10)R.push({p:'mid',ic:'🏫',h:'فجوة بين الفصول',x:`فارق ${fmt(gap)}٪ بين الفصل ${secLabel(s[0].sec,t.grade)} والفصل ${secLabel(s[s.length-1].sec,t.grade)}. يُوصى بتوجيه دعم إضافي للفصل الأقل ونقل الممارسات الناجحة بين الفصول.`});}
 const hard=A.items.filter(i=>i.p!=null&&i.p<.4);
 if(hard.length)R.push({p:'high',ic:'🧩',h:'أسئلة منخفضة الإتقان',x:`الأسئلة (${hard.map(i=>esc(i.label)).join('، ')}) أقل من 40٪ إجابة صحيحة؛ أعد تدريس المهارات المرتبطة بها بطريقة مختلفة (نمذجة، أمثلة محلولة، تجربة/محاكاة).`});
 const weakD=A.items.filter(i=>i.d!=null&&i.d<.2);

 const easy=A.items.filter(i=>i.p!=null&&i.p>=.92);

 if(ws.length)R.push({p:'high',ic:'📚',h:'مهارات تحتاج علاجًا',x:`المهارات الأضعف: ${ws.slice(0,5).map(s=>`${esc(s.skill)} (${fmt(s.pct)}٪)`).join('، ')}.`});
 if(A.total&&A.absent/A.total>.1)R.push({p:'mid',ic:'📅',h:'نسبة غياب ملحوظة',x:`${A.absent} طالب لم يختبروا؛ جدولة اختبار بديل ومتابعة أسباب الغياب.`});

 return R;
}

/* ---------- charts (SVG) ---------- */
function pieSVG(items,size=200){
 const tot=items.reduce((a,b)=>a+b.value,0);
 if(!tot)return `<svg viewBox="0 0 200 200" width="${size}" height="${size}"><circle cx="100" cy="100" r="80" fill="#edf2f9"/><text x="100" y="106" text-anchor="middle" font-size="15" fill="#64748b" font-family="Tajawal">لا بيانات</text></svg>`;
 let a0=-Math.PI/2,out='';const cx=100,cy=96,r=82;
 out+=`<ellipse cx="100" cy="${cy+12}" rx="${r}" ry="${r*.92}" fill="#0a2a5e" opacity=".14"/>`;
 items.forEach(it=>{if(!it.value)return;const ang=it.value/tot*Math.PI*2;const a1=a0+ang;
  if(it.value===tot){out+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="${it.c}"/>`}
  else{const x0=cx+r*Math.cos(a0),y0=cy+r*Math.sin(a0),x1=cx+r*Math.cos(a1),y1=cy+r*Math.sin(a1);
   out+=`<path d="M${cx},${cy} L${x0},${y0} A${r},${r} 0 ${ang>Math.PI?1:0} 1 ${x1},${y1} Z" fill="${it.c}" stroke="#fff" stroke-width="2"/>`;}
  const pc=it.value/tot*100;
  if(pc>=6){const am=a0+ang/2;out+=`<text x="${cx+r*.62*Math.cos(am)}" y="${cy+r*.62*Math.sin(am)+6}" text-anchor="middle" font-size="17" font-weight="900" fill="#fff" font-family="Tajawal" style="paint-order:stroke" stroke="#0003" stroke-width="2">${Math.round(pc)}%</text>`}
  a0=a1;});
 return `<svg viewBox="0 0 200 210" width="${size}" height="${size*1.05}">${out}</svg>`;
}
function donutSVG(pct,size=150){
 const r=58,c=2*Math.PI*r,v=pct==null?0:pct;
 return `<svg viewBox="0 0 150 150" width="${size}" height="${size}"><circle cx="75" cy="75" r="${r}" fill="none" stroke="#dbe3ee" stroke-width="16"/><circle cx="75" cy="75" r="${r}" fill="none" stroke="#1e9e57" stroke-width="16" stroke-linecap="round" stroke-dasharray="${c*v/100} ${c}" transform="rotate(-90 75 75)"/><text x="75" y="86" text-anchor="middle" font-size="32" font-weight="900" fill="#0d2346" font-family="Tajawal">${pct==null?'—':Math.round(pct)+'%'}</text></svg>`;
}
function barsSVG(items,{w=520,h=230,max=100,suffix=''}={}){
 const pad={l:34,r:10,t:22,b:34},W=w-pad.l-pad.r,H=h-pad.t-pad.b;const n=items.length||1;const bw=Math.min(58,W/n*.6);
 let g='';for(let i=0;i<=5;i++){const y=pad.t+H-H*i/5;g+=`<line x1="${pad.l}" x2="${w-pad.r}" y1="${y}" y2="${y}" stroke="#e7edf6"/><text x="${pad.l-6}" y="${y+4}" font-size="13" text-anchor="end" fill="#475569" font-family="Tajawal">${Math.round(max*i/5)}</text>`}
 items.forEach((it,i)=>{const x=pad.l+W/n*(n-1-i)+(W/n-bw)/2;const v=it.value==null?0:it.value;const bh=H*Math.min(v,max)/max;const y=pad.t+H-bh;
  g+=`<rect x="${x}" y="${y}" width="${bw}" height="${bh}" rx="4" fill="${it.c}"/>`;
  g+=`<text x="${x+bw/2}" y="${y-6}" text-anchor="middle" font-size="16" font-weight="900" fill="#0d2346" font-family="Tajawal">${it.value==null?'—':Math.round(it.value)+suffix}</text>`;
  g+=`<text x="${x+bw/2}" y="${h-12}" text-anchor="middle" font-size="14" font-weight="800" fill="#0d2346" font-family="Tajawal">${esc(it.l)}</text>`});
 return `<svg viewBox="0 0 ${w} ${h}" width="100%" style="max-width:${w}px">${g}<line x1="${pad.l}" x2="${w-pad.r}" y1="${pad.t+H}" y2="${pad.t+H}" stroke="#94a3b8"/></svg>`;
}
const hbar=(label,v,c)=>`<div class="bar-row"><span>${label}</span><div class="tr"><div class="fl" style="width:${Math.max(0,Math.min(100,v||0))}%;background:${c}"></div></div><b>${fmt(v)}%</b></div>`;

 const upd=()=>{window._grade=+g.value;window._secs=[...classesOf(st,window._grade)];drawSecs()};
 g.onchange=upd;window._grade=+g.value;

 if(!window._secs.length&&!window._pend&&!id){toast('أضف فصلًا واحدًا على الأقل، أو أرفق ملف الدرجات');return}

 if(qs.length&&Math.abs(qt-total)>0.001&&!confirm(`مجموع درجات الأسئلة (${qt}) لا يساوي الدرجة الكلية (${total}). هل تريد المتابعة؟`))return;
 const data={name,type,subject,stage,grade,total,pass:num($('#f_pass').value)||50,date:$('#f_date').value.trim(),term:$('#f_term').value.trim(),sections:[...window._secs].sort((a,b)=>a-b),questions:qs};
 if(data.sections.length)rememberClasses(stage,grade,data.sections);
 if(id){const t=S.tests.find(x=>x.id===id);if(!data.sections.length)data.sections=t.sections;Object.assign(t,data);t.students.forEach(s=>{if(Array.isArray(s.ans)){s.ans=qs.map((_,i)=>s.ans[i]??'')}})}
 else{if(!data.sections.length)data.sections=[1];data._auto=!window._secs.length;S.tests.push({id:uid(),created:Date.now(),students:[],...data});}

 if(!id){const nt=S.tests[S.tests.length-1];go('entry',{test:nt.id});if(pend)setTimeout(()=>importFile(pend),150)}else render();
}

function curT(){return S.tests.find(x=>x.id===UI.test)}
function upd(i,k,v,re){const t=curT();t.students[i][k]=k==='name'?String(v).trim():v;save();if(re)render()}
function updScore(i,el){const t=curT();let v=num(el.value);if(v!=null&&v>t.total){toast(`الدرجة أكبر من ${t.total}`);v=t.total;el.value=v}t.students[i].score=v==null?'':v;save();refreshRow(i)}
function updQ(i,j,el){const t=curT();const s=t.students[i];const m=t.questions[j].mark;let v=num(el.value);if(v!=null&&v>m){toast(`درجة ${t.questions[j].label} القصوى ${m}`);v=m;el.value=v}s.ans=s.ans||t.questions.map(()=>'');s.ans[j]=v==null?'':v;save();refreshRow(i)}

function parseSection(v,t){
 const ns=(toEn(v).match(/\d+/g)||[]).map(Number);if(!ns.length)return null;
 if(ns.length>=2){const o=ns.find(n=>n!==t.grade);return o!=null?o:ns[0]}
 return ns[0];
}
const isArText=v=>/[؀-ۿ]{2,}/.test(String(v||''))&&num(v)==null;
function guessMap(rows,t){
 const hi=rows.slice(0,15).findIndex(r=>r.some(c=>/اسم/.test(String(c))));
 const hdr=hi>=0?rows[hi].map(c=>String(c).trim()):null;
 const data=rows.slice(hi>=0?hi+1:0);
 const W=Math.max(...rows.map(r=>r.length));
 const col=i=>data.map(r=>r[i]).filter(v=>String(v??'').trim()!=='');
 const m={hi,name:-1,sec:-1,score:-1,q0:-1};
 if(hdr){
  m.name=hdr.findIndex(c=>/اسم/.test(c));
  m.sec=hdr.findIndex(c=>/فصل|شعب|^الصف$/.test(c));
  m.score=hdr.findIndex(c=>/درجة|مجموع|المجموع|الدرجة|total|score/i.test(c)&&!/^(س|q)\s*\d/i.test(c));
  m.q0=hdr.findIndex(c=>/^(س|سؤال|q)\s*[\d٠-٩]+/i.test(c.replace(/\s/g,'')));
 }
 if(m.name<0){let best=-1,bc=0;for(let i=0;i<W;i++){const c=col(i).filter(isArText).length;if(c>bc){bc=c;best=i}}m.name=best<0?0:best}
 if(m.sec<0){for(let i=0;i<W;i++){if(i===m.name)continue;const v=col(i);if(v.length&&v.filter(x=>/^\s*[\d٠-٩]{1,2}\s*\/\s*[\d٠-٩]{1,2}\s*$/.test(String(x))).length>=v.length*.7){m.sec=i;break}}}
 if(t.questions.length&&m.q0<0){
  // أول عمود تتتابع بعده أعمدة رقمية بعدد الأسئلة
  for(let i=0;i+t.questions.length<=W;i++){if(i===m.name||i===m.sec)continue;let ok=true;for(let j=0;j<t.questions.length;j++){const v=col(i+j);if(!v.length||v.some(x=>num(x)==null||num(x)>t.questions[j].mark)){ok=false;break}}if(ok){m.q0=i;break}}
 }
 if(m.score<0){
  let cand=[];for(let i=0;i<W;i++){if(i===m.name||i===m.sec)continue;const v=col(i);if(v.length<Math.max(1,data.length*.5))continue;const ns=v.map(num);if(ns.some(x=>x==null||x<0||x>t.total))continue;
   const seq=ns.every((x,k)=>k===0||x===ns[k-1]+1);if(seq&&ns.length>3)continue;cand.push(i)}
  if(cand.length)m.score=cand[cand.length-1];
 }
 return m;
}

function impParse(){
 const t=curT();const I=_imp;const g=id=>{const e=$(id);return e?+e.value:-1};
 const mN=g('#m_name'),mS=g('#m_sec'),mT=g('#m_score'),mQ=g('#m_q0'),def=g('#m_def');
 const out=[],skip=[];
 I.rows.slice(I.map.hi+1).forEach(r=>{
  const name=String(r[mN]||'').replace(/\s+/g,' ').trim();
  if(!name||!isArText(name)&&!/[a-z]{2}/i.test(name)||/اسم الطالب|^الاسم$|^اسم$/.test(name)){if(r.some(Boolean))skip.push(r);return}
  let sec=def;if(mS>=0){const ps=parseSection(r[mS],t);if(ps)sec=ps}
  const st={id:uid(),name,section:sec,score:'',ans:t.questions.length?t.questions.map(()=>''):null,absent:false,warn:''};
  if(t.questions.length&&mQ>=0){t.questions.forEach((q,j)=>{const v=num(r[mQ+j]);if(v!=null&&v>q.mark)st.warn='درجة سؤال أكبر من المسموح';st.ans[j]=v==null?'':Math.min(v,q.mark)})}
  if(!(t.questions.length&&mQ>=0)&&mT>=0){const raw=String(r[mT]).trim();const v=num(raw);if(v==null){if(/غ|غائب|absent/i.test(raw))st.absent=true}else{if(v>t.total){st.warn=`الدرجة أكبر من ${t.total}`}st.score=Math.min(v,t.total)}}
  out.push(st);
 });
 return{out,skip};
}

 if(t._auto){const fs=[...new Set(out.map(x=>x.section))];if(fs.length)t.sections=[];delete t._auto}
 out.forEach(s=>{delete s.warn;if(!t.sections.includes(s.section))t.sections.push(s.section)});t.sections.sort((a,b)=>a-b);rememberClasses(t.stage,t.grade,t.sections);
 let msg='';
 if(mode==='replace'){t.students=out;msg=`تم إدخال ${out.length} طالب`}
 else if(mode==='update'){let u=0,a=0;const key=n=>n.replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/\s+/g,' ').trim();
  out.forEach(s=>{const e=t.students.find(x=>key(x.name)===key(s.name));if(e){e.score=s.score;e.ans=s.ans;e.absent=s.absent;e.section=s.section;u++}else{t.students.push(s);a++}});msg=`تم تحديث ${u} وإضافة ${a}`}
 else{t.students=t.students.concat(out);msg=`تمت إضافة ${out.length} طالب`}

}

  if(/\.csv$/i.test(f.name)){const txt=await f.text();const rows=txt.replace(/^﻿/,'').replace(/\r/g,'').split('\n').filter(l=>l.trim()).map(l=>l.split(l.includes(';')?';':(l.includes('\t')?'\t':',')).map(c=>c.replace(/^"|"$/g,'').trim()));return importWizard(rows,f.name)}
  toast('جارٍ قراءة ملف Excel…');await loadXLSX();

async function importPDF(f){
 toast('جارٍ قراءة ملف PDF…');
 await loadPDFJS();
 const pdf=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise;
 let items=[];
 for(let p=1;p<=pdf.numPages;p++){
  const pg=await pdf.getPage(p);const tc=await pg.getTextContent();
  tc.items.forEach(it=>{const s=(it.str||'').normalize('NFKC');if(!s.trim())return;items.push({p,s,x:it.transform[4],y:it.transform[5],w:it.width||0,h:Math.abs(it.transform[3])||10})});
 }
 if(!items.length){
  modal('⚠️ ملف PDF بدون نص',`<div class="note">هذا الملف صورة ممسوحة ضوئيًا ولا يحتوي نصًا يمكن قراءته.<br>الحلول: صدّر الكشف من نظام نور بصيغة <b>Excel</b>، أو افتح الملف وانسخ الجدول ثم استخدم <b>لصق من Excel</b>، أو أدخل الدرجات يدويًا.</div>`,`<button class="btn b-light" onclick="closeModal()">حسنًا</button>`);return;
 }
 // كشف النص العربي المقلوب في بعض ملفات PDF
 let fw=0,rv=0;items.forEach(it=>it.s.split(/\s+/).forEach(w=>{if(/^ال[ء-ي]{2,}/.test(w))fw++;if(/[ء-ي]{2,}لا$/.test(w))rv++}));
 if(rv>fw*1.5&&rv>3)items.forEach(it=>{if(/[؀-ۿ]/.test(it.s))it.s=[...it.s].reverse().join('')});
 // تجميع العناصر في صفوف حسب الموضع الرأسي ثم خلايا من اليمين لليسار
 items.sort((a,b)=>a.p-b.p||b.y-a.y||b.x-a.x);
 const lines=[];
 items.forEach(it=>{const L=lines.find(l=>l.p===it.p&&Math.abs(l.y-it.y)<=Math.max(2.5,it.h*.45));if(L)L.items.push(it);else lines.push({p:it.p,y:it.y,items:[it]})});
 lines.sort((a,b)=>a.p-b.p||b.y-a.y);
 const rows=lines.map(l=>{
  const its=l.items.sort((a,b)=>(b.x+b.w)-(a.x+a.w));
  // 1) تجميع الحروف المتلاصقة في كلمات
  const words=[];let g=null;
  its.forEach(it=>{const gap=g?g.left-(it.x+it.w):1e9;if(g&&gap<it.h*.18){g.parts.push(it);g.left=Math.min(g.left,it.x)}else{g={parts:[it],left:it.x,right:it.x+it.w,h:it.h};words.push(g)}});
  words.forEach(w=>{const ar=w.parts.some(x=>/[\u0600-\u06FF]/.test(x.s));const ps=ar?w.parts:[...w.parts].sort((a,b)=>a.x-b.x);w.s=ps.map(x=>x.s).join('').trim();w.num=num(w.s)!=null});
  // 2) تجميع الكلمات في خلايا
  const cells=[];let cur=null;
  words.filter(w=>w.s).forEach(w=>{if(cur&&!w.num&&!cur.num&&(cur.left-w.right)<w.h*1.1){cur.s+=' '+w.s;cur.left=w.left}else{cur={s:w.s,left:w.left,num:w.num};cells.push(cur)}});
  return cells.map(c=>c.s.replace(/\s+/g,' ').trim());
 }).filter(r=>r.length);
 // توحيد الصفوف: الاسم ثم بقية الخلايا بالترتيب
 const norm=rows.map(r=>{const ni=r.reduce((b,c,i)=>isArText(c)&&c.split(' ').length>=2&&(b<0||c.length>r[b].length)?i:b,-1);if(ni<0)return r;return [r[ni],...r.filter((_,i)=>i!==ni)]});
 const W=Math.max(...norm.map(r=>r.length));
 // صف عناوين صناعي ليسهل الاختيار
 const head=['الاسم',...Array.from({length:W-1},(_,i)=>'خانة '+(i+1))];
 const body=norm.filter(r=>isArText(r[0])&&r[0].split(' ').length>=2&&r.slice(1).some(c=>num(c)!=null||/غ/.test(c)));
 if(!body.length){importWizard(rows,f.name);return}
 importWizard([head,...body],f.name+' (PDF)');
}

/* ---------- الحفظ السحابي في مستودع المنصة (بطريقة ملف الإنجاز) ----------
   يستخدم رمز الوصول نفسه المحفوظ لملف الإنجاز (pf1448.control.ghtoken).
   المستودع عام، لذلك تُشفَّر البيانات (AES-256) بكلمة مرور لا يعرفها غيرك. */
const CLOUD={tk:'pf1448.control.ghtoken',pk:'results.cloud.pass',repo:'aak64417-glitch/science-unified-hub',dir:'results-data/'};
const Cloud={key:null,salt:null,sha:null,busy:false,dirty:false,last:0,timer:null,st:'off',msg:''};
const lsGet=k=>{try{return localStorage.getItem(k)||''}catch(e){return''}};
const lsSet=(k,v)=>{try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}};
const cloudOn=()=>!!(lsGet(CLOUD.tk)&&lsGet(CLOUD.pk));
const b64ToBytes=s=>Uint8Array.from(atob(String(s).replace(/\s/g,'')),c=>c.charCodeAt(0));
const bytesToB64=b=>{let s='';for(let i=0;i<b.length;i+=0x8000)s+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(s)};
async function gh(method,path,body,raw){
 const url=raw||`https://api.github.com/repos/${CLOUD.repo}/contents/${path}`+(method==='GET'?`?ref=main&t=${Date.now()}`:'');
 const r=await fetch(url,{method,cache:'no-store',headers:{Authorization:'Bearer '+lsGet(CLOUD.tk),Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'},body:body?JSON.stringify(body):undefined});
 const d=await r.json().catch(()=>({}));
 if(!r.ok){const e=new Error(r.status===401?'رمز الوصول غير صحيح أو منتهي الصلاحية':r.status===403?'رمز الوصول لا يملك صلاحية الكتابة على المستودع':r.status===409?'conflict':(d.message||'تعذّر الاتصال بـ GitHub'));e.status=r.status;throw e}
 return d;
}
async function ghRead(path){
 try{const d=await gh('GET',path);let b64=d.content&&d.encoding==='base64'?d.content:null;
  if(!b64){const bl=await gh('GET','',null,`https://api.github.com/repos/${CLOUD.repo}/git/blobs/${d.sha}`);b64=bl.content}
  return{text:new TextDecoder().decode(b64ToBytes(b64)),sha:d.sha}}
 catch(e){if(e.status===404)return null;throw e}
}
const ghWrite=(path,text,sha,msg)=>gh('PUT',path,Object.assign({message:msg,content:bytesToB64(new TextEncoder().encode(text)),branch:'main'},sha?{sha}:{}));
async function ghDelete(path,msg){try{const d=await gh('GET',path);await gh('DELETE',path,{message:msg,sha:d.sha,branch:'main'})}catch(e){if(e.status!==404)throw e}}
async function deriveKey(pass,salt){const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:250000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function ensureKey(){if(!Cloud.key){if(!Cloud.salt)Cloud.salt=crypto.getRandomValues(new Uint8Array(16));Cloud.key=await deriveKey(lsGet(CLOUD.pk),Cloud.salt)}}
async function encObj(obj){await ensureKey();const iv=crypto.getRandomValues(new Uint8Array(12));const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},Cloud.key,new TextEncoder().encode(JSON.stringify(obj))));return JSON.stringify({v:1,app:'results-analysis',salt:bytesToB64(Cloud.salt),iv:bytesToB64(iv),ct:bytesToB64(ct)})}
async function decObj(text){const e=JSON.parse(text);if(!Cloud.key||bytesToB64(Cloud.salt||new Uint8Array())!==e.salt){Cloud.salt=b64ToBytes(e.salt);Cloud.key=await deriveKey(lsGet(CLOUD.pk),Cloud.salt)}
 try{const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64ToBytes(e.iv)},Cloud.key,b64ToBytes(e.ct));return JSON.parse(new TextDecoder().decode(pt))}catch(x){const er=new Error('كلمة مرور الحفظ السحابي لا تطابق البيانات المحفوظة');er.badPass=true;throw er}}
function setCloud(st,msg=''){Cloud.st=st;Cloud.msg=msg;storeInfo()}
/* تتبع التعديلات والحذف لدمج البيانات بين الأجهزة */
let SNAP=null;
function track(mark=true){
 const now=Date.now();S.deleted=S.deleted||{};const h={},ids=new Set();
 S.tests.forEach(t=>{ids.add(t.id);const{upd,...rest}=t;const x=JSON.stringify(rest);h[t.id]=x;if(mark&&(!t.upd||(SNAP&&SNAP.h[t.id]!==undefined&&SNAP.h[t.id]!==x)))t.upd=now});
 const{upd:su,lastBackup,...sr}=S.settings;const sh=JSON.stringify(sr);
 if(mark&&SNAP){if(SNAP.s!==sh)S.settings.upd=now;SNAP.ids.forEach(id=>{if(!ids.has(id))S.deleted[id]=now})}
 SNAP={h,ids,s:sh};
}
function mergeState(L,R){
 R=migrate(R);const del=Object.assign({},R.deleted||{},L.deleted||{});
 const map={};[...R.tests,...L.tests].forEach(t=>{if(del[t.id])return;const c=map[t.id];if(!c||(t.upd||0)>(c.upd||0))map[t.id]=t});
 const rep={};[...(R.reports||[]),...(L.reports||[])].forEach(r=>{if(!del[r.id])rep[r.id]=r});
 const settings=(R.settings.upd||0)>(L.settings.upd||0)?R.settings:L.settings;
 return Object.assign({},L,{settings,tests:Object.values(map).sort((a,b)=>(a.created||0)-(b.created||0)),reports:Object.values(rep),deleted:del});
}
async function cloudPull(){
 const f=await ghRead(CLOUD.dir+'data.enc');
 if(!f){Cloud.sha=null;return false}
 const remote=await decObj(f.text);Cloud.sha=f.sha;
 S=mergeState(S,remote);track(false);try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}
 return true;
}
async function cloudPush(){
 if(!cloudOn())return;
 if(Cloud.busy){Cloud.dirty=true;return}
 Cloud.busy=true;clearTimeout(Cloud.timer);Cloud.timer=null;setCloud('saving');
 const put=async()=>{const d=await ghWrite(CLOUD.dir+'data.enc',await encObj(S),Cloud.sha,'تحليل النتائج: حفظ البيانات (مشفّرة)');Cloud.sha=d.content.sha};
 try{
  try{await put()}catch(e){if(e.status===409||e.status===422){await cloudPull();await put();render()}else throw e}
  Cloud.last=Date.now();setCloud('ok');
 }catch(e){setCloud('err',e.message)}
 finally{Cloud.busy=false;if(Cloud.dirty){Cloud.dirty=false;schedulePush()}}
}
function schedulePush(){
 if(!cloudOn())return;Cloud.pending=true;if(Cloud.timer)return;
 const wait=Math.max(4000,Cloud.last+30000-Date.now());setCloud('wait');
 Cloud.timer=setTimeout(()=>{Cloud.timer=null;Cloud.pending=false;cloudPush()},wait);
}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'&&Cloud.timer){clearTimeout(Cloud.timer);Cloud.timer=null;cloudPush()}});

 if(!lsGet(CLOUD.tk)){toast('أدخل رمز الوصول (نفس رمز ملف الإنجاز)');return}
 const p=$('#c_pass').value;if(p.length<6){toast('كلمة المرور ٦ أحرف على الأقل');return}
 lsSet(CLOUD.pk,p);Cloud.key=null;Cloud.salt=null;Cloud.sha=null;setCloud('saving','جارٍ الاتصال…');
 try{const had=await cloudPull();await cloudPush();if(Cloud.st==='err')throw new Error(Cloud.msg);
  toast(had?'✅ تم الربط ودمج البيانات المحفوظة':'✅ تم تفعيل الحفظ في المنصة');render()}

  <div class="note">البيانات محفوظة في هذا المتصفح على هذا الجهاز فقط. صدّر نسخة احتياطية بانتظام (بعد كل إدخال مهم) واحفظها في Google Drive أو جهازك، ويمكنك استيرادها على أي جهاز آخر.</div>
  <div class="flex" style="flex-wrap:wrap;margin-top:12px">
   <button class="btn b-gold" onclick="backup()">${ico('dl')}تصدير نسخة احتياطية (JSON)</button>
   <label class="btn b-navy" style="cursor:pointer">${ico('up')}استيراد نسخة احتياطية<input type="file" accept=".json" class="hide" onchange="restore(this.files[0])"></label>
   <button class="btn b-light" onclick="demo()">تحميل بيانات تجريبية للتجربة</button>
   ${S.tests.some(t=>t.demo)?`<button class="btn b-red" onclick="S.tests=S.tests.filter(t=>!t.demo);save();render();toast('حُذفت البيانات التجريبية')">حذف البيانات التجريبية</button>`:''}
   <button class="btn b-red" onclick="if(confirm('حذف جميع الاختبارات والدرجات نهائيًا؟ صدّر نسخة احتياطية أولًا.')){S.tests=[];save();render()}">${ico('trash')}حذف كل البيانات</button>
  </div></div></div>`;
}
function setLogo(f){if(!f)return;const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const c=document.createElement('canvas');const k=Math.min(1,240/Math.max(img.width,img.height));c.width=img.width*k;c.height=img.height*k;c.getContext('2d').drawImage(img,0,0,c.width,c.height);S.settings.logo=c.toDataURL('image/png');save();render()};img.src=r.result};r.readAsDataURL(f)}
function backup(){S.settings.lastBackup=Date.now();save();const d=new Date();dl(new Blob([JSON.stringify(S,null,1)],{type:'application/json'}),`نسخة-تحليل-النتائج-${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}.json`);toast('✅ تم تصدير النسخة الاحتياطية')}
async function restore(f){if(!f)return;try{const o=JSON.parse(await f.text());if(!o.tests)throw 0;
 const mode=S.tests.length?confirm('اضغط «موافق» لدمج النسخة مع البيانات الحالية، أو «إلغاء» لاستبدالها بالكامل.'):false;
 if(mode){const ids=new Set(S.tests.map(t=>t.id));o.tests.forEach(t=>{if(!ids.has(t.id))S.tests.push(t)})}else{S=migrate(o)}
 save();render();toast('✅ تم استيراد النسخة')}catch(e){toast('ملف غير صالح')}}
function demo(){
 const mk=(name,type,stage,grade,total,secs,qs,n,base)=>{const t={id:uid(),created:Date.now()+Math.random(),demo:true,name:name+' (تجريبي)',type,stage,grade,subject:'العلوم',total,pass:50,date:'',term:'',sections:secs,questions:qs,students:[]};
  let k=1;secs.forEach(sc=>{for(let i=0;i<n;i++){const ab=Math.max(0,Math.min(1,base+(Math.random()-.5)*.7+(sc===secs[0]?.05:-.03)));const st={id:uid(),name:'طالب '+String(k++).padStart(2,'0'),section:sc,score:'',ans:null,absent:Math.random()<.04};
   if(qs.length){st.ans=qs.map(q=>{const pr=ab*(q.h||1);return Math.random()<pr?q.mark:(Math.random()<.3?q.mark/2:0)})}else st.score=Math.round(ab*total*2)/2;t.students.push(st)}});return t};
 const qs=Array.from({length:10},(_,i)=>({label:'س'+(i+1),mark:2,skill:['المادة وخصائصها','المادة وخصائصها','التغيرات الفيزيائية','التغيرات الفيزيائية','التغيرات الكيميائية','التغيرات الكيميائية','الكثافة','الكثافة','المخاليط','المخاليط'][i],h:[1.1,1,1.05,.9,.7,.55,.6,.5,1,1.1][i]}));
 S.tests.push(mk('الاختبار الفتري الأول','periodic','m',1,20,[1,2,3],qs,24,.72),mk('الاختبار التشخيصي','diagnostic','m',3,15,[1,2],[],30,.6),mk('اختبار قصير ١','short','m',1,10,[1,2],[],22,.8),mk('تدريب نافس ١','nafs','m',3,30,[1,2],[],30,.68),mk('الاختبار النهائي','final','m',2,40,[1],[],28,.75));
 save();render();toast('تم تحميل بيانات تجريبية (أسماء رمزية) — يمكنك حذفها من هنا');
}

/* ---------- HELP ---------- */
function vHelp(){return `<div class="toolbar"><h2>المساعدة والدعم</h2></div><div class="panel"><div class="pb help">
 <h3>١) إنشاء اختبار</h3><p>من <b>إدارة الاختبارات ← اختبار جديد</b>: حدّد النوع (فتري، تشخيصي، قصير، نافس، نهائي)، والمرحلة والصف، والمادة، و<b>الدرجة الكلية</b> وحد النجاح، والفصول المختبَرة. تُحسب النسب المئوية دائمًا من الدرجة الكلية لكل اختبار، لذلك يمكن مقارنة اختبار من ١٠ باختبار من ٤٠.</p>
 <h3>٢) تحليل الأسئلة (اختياري)</h3><p>أدخل عدد الأسئلة ودرجة كل سؤال واكتب المهارة أو ناتج التعلم لكل سؤال؛ تحصل حينها على معامل الصعوبة والتمييز، وإتقان المهارات، وخطة علاجية حسب المهارة.</p>
 <h3>٣) إضافة الدرجات</h3><p>من الرئيسية اضغط <b>إضافة درجات اختبار</b> واختر الاختبار (أو من بطاقة الاختبار ← <b>إدخال الدرجات</b>)، ثم اختر إحدى الطرق:</p><ul><li><b>ملف Excel</b> ‎(.xlsx / .csv): مثل كشف الدرجات المصدَّر من نظام نور، أو <b>نموذج Excel الفارغ</b> من المنصة بعد تعبئته.</li><li><b>ملف PDF:</b> كشف درجات يحتوي نصًا (غير ممسوح ضوئيًا). تُقرأ الأسماء والأرقام تلقائيًا.</li><li><b>لصق:</b> انسخ الأعمدة من Excel أو جداول Google والصقها.</li><li><b>يدويًا:</b> أضف صفوفًا واكتب مباشرة.</li></ul><p>بعد رفع الملف تظهر <b>شاشة معاينة</b>: تأكد من عمود الاسم والفصل والدرجة (تُحدَّد تلقائيًا ويمكن تغييرها)، واختر: إضافة، أو استبدال الكل، أو <b>تحديث حسب الاسم</b> (لإكمال درجات طلاب موجودين). الدرجة الأكبر من الدرجة الكلية تظهر بتنبيه أحمر.</p>
 <h3>٤) التقارير</h3><p><b>بالأسماء:</b> للمعلم وولي الأمر والإرشاد — يتضمن كشف النتائج وقوائم الدعم والتميز. <b>بدون أسماء:</b> إحصائي للإدارة وملف الإنجاز. اضغط «طباعة / حفظ PDF» واختر «حفظ بتنسيق PDF» من نافذة الطباعة.</p>
 <h3>٥) قراءة المؤشرات</h3><ul><li><b>الوسيط:</b> الدرجة التي يقع نصف الطلاب تحتها — أدق من المتوسط عند وجود درجات متطرفة.</li><li><b>الانحراف المعياري:</b> كلما ارتفع زاد تفاوت الطلاب (فوق ١٨ يستدعي تعليمًا متمايزًا).</li><li><b>معامل الصعوبة:</b> نسبة الإتقان؛ أقل من ٤٠٪ صعب ويحتاج إعادة تدريس.</li><li><b>معامل التمييز:</b> أقل من ٠٫٢ يعني أن السؤال لا يفرّق بين المتفوق والضعيف.</li></ul>
 <h3>٦) حفظ البيانات والتقارير</h3><p>من <b>الإعدادات ← الحفظ في المنصة</b> اكتب كلمة مرور للتشفير واضغط «تفعيل» (يُستخدم رمز الوصول نفسه المحفوظ لملف الإنجاز). بعدها تُحفظ الاختبارات والدرجات تلقائيًا في مستودع المنصة مشفّرة، وتظهر على أي جهاز تفعّل فيه الحفظ بالرمز وكلمة المرور نفسيهما. لحفظ تقرير افتحه واضغط <b>«💾 حفظ التقرير في المنصة»</b>، وتجده في <b>التقارير المحفوظة</b>. ويبقى «تصدير نسخة احتياطية» متاحًا كاحتياط إضافي.</p>
</div></div>`}

/* ---------- modal ---------- */
function modal(title,body,foot){$('#modal').innerHTML=`<div class="mh">${title}<button onclick="closeModal()">✕</button></div><div class="mb">${body}</div>${foot?`<div class="mf">${foot}</div>`:''}`;$('#ov').classList.add('show')}
function closeModal(){$('#ov').classList.remove('show')}
$('#ov').addEventListener('click',e=>{if(e.target.id==='ov')closeModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();closeReport()}});
document.addEventListener('dragover',e=>{if(UI.view==='entry'){e.preventDefault();document.body.classList.add('drag')}});
document.addEventListener('dragleave',e=>{if(!e.relatedTarget)document.body.classList.remove('drag')});
document.addEventListener('drop',e=>{if(UI.view!=='entry')return;e.preventDefault();document.body.classList.remove('drag');const f=e.dataTransfer.files[0];if(f)importFile(f)});
window.addEventListener('beforeunload',()=>{try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}});
track(false);render();
if(cloudOn()){setCloud('saving','جارٍ تحميل البيانات من المنصة…');cloudPull().then(h=>{setCloud('ok');Cloud.last=Date.now();render()}).catch(e=>{if(e.badPass)lsSet(CLOUD.pk,null);setCloud(cloudOn()?'err':'off',e.message);toast('⚠️ '+e.message)})}
</script>
