<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07111f">
<meta name="robots" content="noindex">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>رحلة عالم العلوم</title>

<style>
html,body{
  margin:0;
  min-height:100%;
  background:#07111f;
  color:#f7fbff;
  font-family:Tahoma,"Noto Sans Arabic",Arial,sans-serif
}

.loading{
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:24px;
  text-align:center
}

.box{
  max-width:620px
}

.spinner{
  width:44px;
  height:44px;
  margin:18px auto;
  border:4px solid rgba(255,255,255,.18);
  border-top-color:#42ded4;
  border-radius:50%;
  animation:spin .75s linear infinite
}

.muted{
  color:#9fb2c8;
  line-height:1.9
}

button{
  border:0;
  border-radius:14px;
  padding:12px 20px;
  font:inherit;
  font-weight:900;
  background:#42ded4;
  color:#07111f;
  cursor:pointer
}

@keyframes spin{
  to{transform:rotate(360deg)}
}
</style>
</head>

<body>

<div class="loading" id="loader">
  <div class="box">
    <h2>رحلة عالم العلوم</h2>

    <div class="spinner"></div>

    <p class="muted">
      جاري فتح النشاط بأحدث نسخة…
    </p>
  </div>
</div>

<script>
(async function () {

  try {

    // الصفحة العاملة الحالية تبقى في جذر المستودع.
    // هذا الملف يجعل /journey/ هو الرابط الثابت الوحيد الذي يراه الطالب.

    const source = new URL(
      '../journey-student-recovery-v4.html',
      location.href
    );

    // رقم إصدار لمنع أي نسخة قديمة متبقية.
    source.searchParams.set(
      '_v',
      '20260923-journey-stable'
    );

    const response = await fetch(
      source.href,
      {
        cache:'no-store'
      }
    );

    if(!response.ok){
      throw new Error(
        'HTTP ' + response.status
      );
    }

    let html = await response.text();

    // لأن الصفحة الأصلية موجودة في جذر المستودع،
    // نحافظ على عمل الروابط النسبية داخلها.

    html = html.replace(
      /<head(\s[^>]*)?>/i,
      function(match){

        return match +
        '\n<base href="../">';

      }
    );

    // إزالة عبارة "نسخة الاستعادة"
    // من عنوان الصفحة الذي يراه الطالب.

    html = html.replace(

      /<title>\s*رحلة عالم العلوم\s*-\s*نسخة الاستعادة\s*<\/title>/i,

      '<title>رحلة عالم العلوم</title>'

    );

    // عرض منصة الطالب داخل الرابط الثابت /journey/
    // دون تغيير عنوان الرابط في المتصفح.

    document.open();

    document.write(html);

    document.close();

  }

  catch(error){

    const loader =
      document.getElementById('loader');

    loader.innerHTML = `

      <div class="box">

        <h2>
          تعذر فتح رحلة عالم العلوم
        </h2>

        <p class="muted">
          لم يتم عرض نسخة قديمة من المنصة.
          تأكد من اتصال الإنترنت ثم أعد المحاولة.
        </p>

        <button onclick="location.reload()">
          إعادة المحاولة
        </button>

      </div>

    `;

    console.error(
      'Journey loader error:',
      error
    );

  }

})();
</script>

</body>
</html>
