const app=document.getElementById('app');
const loading=document.getElementById('loading');

function cleanStudentUI(d){
  d.querySelectorAll('a[href="index.html"],a[href*="journey-teacher.html"]').forEach(a=>a.remove());
  const actions=d.querySelector('.actions');
  if(actions) [...actions.querySelectorAll('a')].forEach(a=>a.remove());
  const state=d.getElementById('linkState');
  if(state){state.textContent='منصة الطالب';state.className='pill good';}
}

function installStandaloneMode(w,d){
  try{ if(w.CFG) w.CFG.apiUrl=''; }catch(e){}
  try{ w.localStorage.removeItem('science_api_url'); }catch(e){}

  w.loadStudentsForClass=function(){
    const classSel=d.getElementById('studentClass');
    const nameSel=d.getElementById('studentName');
    const status=d.getElementById('studentsStatus');
    if(!classSel||!nameSel) return;
    const className=classSel.value;
    if(!className){
      nameSel.innerHTML='<option value="">اختر الفصل أولًا</option>';
      nameSel.disabled=true;
      if(status) status.textContent='اختر الفصل لتظهر أسماء الطلاب.';
      return;
    }
    const names=ROSTERS[className]||[];
    nameSel.innerHTML='<option value="">اختر اسمك</option>'+names.map((name,i)=>{
      const code=className.replace('/','_')+'_'+String(i+1).padStart(2,'0');
      return '<option value="'+code+'">'+name.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')+'</option>';
    }).join('');
    nameSel.disabled=false;
    if(status){
      status.textContent=names.length?'تم تحميل '+names.length+' طالبًا من الفصل '+className+'.':'لا توجد أسماء مسجلة لهذا الفصل.';
      if(names.length) status.classList.add('good');
    }
  };

  const classSel=d.getElementById('studentClass');
  if(classSel){
    classSel.onchange=w.loadStudentsForClass;
    if(classSel.value) w.loadStudentsForClass();
  }

  // استبدال بدء النشاط بوضع مستقل دون Apps Script.
  try{
    w.eval(`
      startActivity = async function(){
        const className=$('studentClass').value,
              select=$('studentName'),
              code=select.value,
              name=select.options[select.selectedIndex]?.text||'';
        if(!className){alert('اختر الفصل أولًا.');return}
        if(!code){alert('اختر اسمك من القائمة.');return}
        state.student={name,className,code};
        if(state.mode==='exam'||state.task?.mode==='exam'){
          const k='science_exam_once_'+className+'_'+code;
          if(localStorage.getItem(k)==='1'){alert('تم استخدام محاولة الاختبار لهذا الطالب على هذا الجهاز.');return}
          localStorage.setItem(k,'1');
        }
        buildQuiz();
        state.startedAt=Date.now();
        screen('quizScreen');
        renderQuestion();
      }
    `);
    const startBtn=d.getElementById('startActivity');
    if(startBtn) startBtn.onclick=w.startActivity;
  }catch(e){console.error(e)}

  // منع أي محاولة انتقال إداري من داخل صفحة الطالب.
  d.addEventListener('click',function(e){
    const a=e.target.closest&&e.target.closest('a');
    if(!a) return;
    const href=(a.getAttribute('href')||'').toLowerCase();
    if(href.includes('journey-teacher')||href==='index.html'){
      e.preventDefault(); e.stopPropagation();
    }
  },true);

  try{
    new w.MutationObserver(()=>cleanStudentUI(d)).observe(d.documentElement,{childList:true,subtree:true});
  }catch(e){}
}

app.addEventListener('load',()=>{
  try{
    const w=app.contentWindow,d=app.contentDocument;
    cleanStudentUI(d);
    installStandaloneMode(w,d);
    cleanStudentUI(d);
    loading.style.display='none';
  }catch(e){
    console.error(e);
    loading.innerHTML='<div><b>تعذر تجهيز منصة الطالب</b><span>تأكد من رفع هذا الملف بجانب journey-student.html في نفس المستودع ثم أعد المحاولة.</span></div>';
  }
});
