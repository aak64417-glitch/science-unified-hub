<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07111f">
<meta name="robots" content="noindex">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>لوحة المعلم | رحلة عالم العلوم</title>
<style>
html,body{margin:0;min-height:100%;background:#07111f;color:#fff;font-family:Tahoma,Arial,sans-serif}
.loading{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}
.spinner{width:42px;height:42px;margin:16px auto;border:4px solid rgba(255,255,255,.18);border-top-color:#42ded4;border-radius:50%;animation:spin .75s linear infinite}
.muted{color:#9fb2c8;line-height:1.8}
button{border:0;border-radius:14px;padding:12px 18px;font:inherit;font-weight:900;background:#42ded4;color:#07111f;cursor:pointer}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="loading" id="loader">
  <div>
    <h2>لوحة المعلم</h2>
    <div class="spinner"></div>
    <p class="muted">جاري فتح أحدث نسخة…</p>
  </div>
</div>

<script>
(async function(){
  try{
    const source=new URL('journey-teacher-recovery-v4-5.html',location.href);
    source.searchParams.set('_v','20260923-stable-teacher');

    const response=await fetch(source.href,{cache:'no-store'});
    if(!response.ok) throw new Error('HTTP '+response.status);

    let html=await response.text();

    // توحيد روابط الطلاب التي تنشئها لوحة المعلم إلى المسار الثابت الجديد.
    html=html.replaceAll('journey-student-recovery-v4.html','journey/');

    // تنظيف عنوان الصفحة.
    html=html.replace(
      /<title>\s*لوحة المعلم\s*-\s*نسخة الاستعادة\s*V4\.5\s*\|\s*رحلة عالم العلوم\s*<\/title>/i,
      '<title>لوحة المعلم | رحلة عالم العلوم</title>'
    );


    const loginTimePatch = `
<script>
(function(){
  function journeyResultLoginTime(r){
    if(r && r.loginAt) return r.loginAt;
    if(r && r.startedAt) return r.startedAt;

    // توافق آمن مع النتائج القديمة: وقت تقريبي لبداية المحاولة
    const submitted = r && (r.submittedAt || r.timestamp);
    const t = new Date(submitted || '').getTime();
    const durationMs = Math.max(0, Number(r && r.durationSec || 0)) * 1000;
    if(Number.isFinite(t)) return new Date(Math.max(0, t - durationMs)).toISOString();
    return '';
  }

  function journeyFormatLoginDateTime(value){
    if(!value) return '—';
    const d = new Date(value);
    if(Number.isNaN(d.getTime())) return '—';
    return new Intl.DateTimeFormat('ar-SA-u-ca-gregory',{
      year:'numeric',
      month:'2-digit',
      day:'2-digit',
      hour:'2-digit',
      minute:'2-digit',
      second:'2-digit',
      hour12:true
    }).format(d);
  }

  // نغلف الدالة الحالية ولا نستبدل منطقها.
  if(typeof renderResults === 'function'){
    const originalRenderResults = renderResults;
    renderResults = function(){
      const value = originalRenderResults.apply(this, arguments);

      try{
        const head = document.querySelector('#resultsTab thead tr');
        if(head && !head.querySelector('[data-journey-login]')){
          const th = document.createElement('th');
          th.dataset.journeyLogin = '1';
          th.textContent = 'تاريخ ووقت الدخول';
          head.insertBefore(th, head.lastElementChild);
        }

        const raw = typeof filteredRawResults === 'function' ? filteredRawResults() : [];
        const rows = typeof aggregateResults === 'function' ? aggregateResults(raw) : [];
        const trs = [...document.querySelectorAll('#resultsBody tr')];

        rows.forEach((r,i)=>{
          const tr = trs[i];
          if(!tr || tr.querySelector('[data-journey-login-cell]')) return;
          const latest = (r.rows && r.rows.length) ? r.rows[r.rows.length-1] : r;
          const td = document.createElement('td');
          td.dataset.journeyLoginCell = '1';
          const v = journeyResultLoginTime(latest);
          td.textContent = journeyFormatLoginDateTime(v);
          tr.insertBefore(td, tr.lastElementChild);
        });
      }catch(e){
        console.warn('Journey login-time results patch:', e);
      }

      return value;
    };
  }

  // نغلف جدول التقارير الحالي ونضيف عمودًا فقط.
  if(typeof reportRowsTable === 'function'){
    const originalReportRowsTable = reportRowsTable;
    reportRowsTable = function(rows){
      const html = originalReportRowsTable.apply(this, arguments);
      try{
        if(!Array.isArray(rows) || !rows.length) return html;

        const tpl = document.createElement('template');
        tpl.innerHTML = html;
        const table = tpl.content.querySelector('table');
        if(!table) return html;

        const hr = table.querySelector('thead tr');
        if(hr && !hr.querySelector('[data-journey-login-report]')){
          const th = document.createElement('th');
          th.dataset.journeyLoginReport = '1';
          th.textContent = 'تاريخ ووقت الدخول';
          hr.appendChild(th);
        }

        const bodyRows = [...table.querySelectorAll('tbody tr')];
        rows.forEach((r,i)=>{
          const tr = bodyRows[i];
          if(!tr || tr.querySelector('[data-journey-login-report-cell]')) return;
          const td = document.createElement('td');
          td.dataset.journeyLoginReportCell = '1';
          const v = journeyResultLoginTime(r);
          td.textContent = journeyFormatLoginDateTime(v);
          tr.appendChild(td);
        });

        return tpl.innerHTML;
      }catch(e){
        console.warn('Journey login-time report patch:', e);
        return html;
      }
    };
  }


  // إضافة تاريخ ووقت الدخول إلى تقرير المشاركة الخاص بالتكليف.
  function journeyParticipationLatestResult(taskId,p,d){
    try{
      const selectedTask = taskId && typeof taskById === 'function' ? taskById(taskId) : null;
      const wantedName = typeof normalizeStudentNameKey === 'function'
        ? normalizeStudentNameKey(p && p.studentName || '')
        : String(p && p.studentName || '').trim();

      const wantedClass = typeof normalizeClassName === 'function'
        ? normalizeClassName((p && p.className) || (d && d.className) || (selectedTask && selectedTask.className) || '')
        : String((p && p.className) || (d && d.className) || '').trim();

      let rows = (Array.isArray(results) ? results : []).filter(function(r){
        const rn = typeof normalizeStudentNameKey === 'function'
          ? normalizeStudentNameKey(r && r.studentName || '')
          : String(r && r.studentName || '').trim();

        const rc = typeof normalizeClassName === 'function'
          ? normalizeClassName(r && r.className || '')
          : String(r && r.className || '').trim();

        if(rn !== wantedName) return false;
        if(wantedClass && rc !== wantedClass) return false;
        if(taskId) return String(r && r.taskId || '') === String(taskId);
        return true;
      });

      if(!rows.length && selectedTask && typeof participationTitleKey === 'function'){
        const wantedTitle = participationTitleKey((d && d.title) || selectedTask.title || '');
        rows = (Array.isArray(results) ? results : []).filter(function(r){
          const rn = typeof normalizeStudentNameKey === 'function'
            ? normalizeStudentNameKey(r && r.studentName || '')
            : String(r && r.studentName || '').trim();

          const rc = typeof normalizeClassName === 'function'
            ? normalizeClassName(r && r.className || '')
            : String(r && r.className || '').trim();

          if(rn !== wantedName) return false;
          if(wantedClass && rc !== wantedClass) return false;
          if(typeof participationModeMatches === 'function' && !participationModeMatches(r,selectedTask)) return false;

          const rt = participationTitleKey(
            typeof resultTitle === 'function' ? resultTitle(r) : (r && (r.taskTitle || r.lesson) || '')
          );
          if(!wantedTitle || !rt) return false;
          return rt === wantedTitle || rt.includes(wantedTitle) || wantedTitle.includes(rt);
        });
      }

      rows.sort(function(a,b){
        const at = new Date(typeof resultTime === 'function' ? resultTime(a) : (a && (a.timestamp || a.submittedAt) || '')).getTime() || 0;
        const bt = new Date(typeof resultTime === 'function' ? resultTime(b) : (b && (b.timestamp || b.submittedAt) || '')).getTime() || 0;
        return at - bt;
      });

      return rows.length ? rows[rows.length-1] : null;
    }catch(e){
      console.warn('Journey participation latest-result lookup:',e);
      return null;
    }
  }

  if(typeof generateParticipationReport === 'function'){
    const originalGenerateParticipationReport = generateParticipationReport;

    generateParticipationReport = async function(taskId=''){
      const result = await originalGenerateParticipationReport.apply(this, arguments);

      try{
        const d = typeof participationData === 'function' ? participationData(taskId) : null;
        if(!d || !Array.isArray(d.participants)) return result;

        const modal = document.getElementById('reportModal');
        if(!modal) return result;

        const tables = [...modal.querySelectorAll('table')];
        const table = tables.length ? tables[tables.length-1] : null;
        if(!table) return result;

        const head = table.querySelector('thead tr');
        if(head && !head.querySelector('[data-journey-participation-login]')){
          const th = document.createElement('th');
          th.dataset.journeyParticipationLogin = '1';
          th.textContent = 'تاريخ ووقت الدخول';
          head.appendChild(th);
        }

        const bodyRows = [...table.querySelectorAll('tbody tr')];
        d.participants.forEach(function(participant,i){
          const tr = bodyRows[i];
          if(!tr || tr.querySelector('[data-journey-participation-login-cell]')) return;

          const latest = journeyParticipationLatestResult(taskId,participant,d);
          const td = document.createElement('td');
          td.dataset.journeyParticipationLoginCell = '1';

          const v = journeyResultLoginTime(latest);
          td.textContent = journeyFormatLoginDateTime(v);
          tr.appendChild(td);
        });
      }catch(e){
        console.warn('Journey participation login-time patch:',e);
      }

      return result;
    };
  }

  window.journeyResultLoginTime = journeyResultLoginTime;
  window.journeyFormatLoginDateTime = journeyFormatLoginDateTime;

  // إعادة رسم النتائج فورًا حتى يظهر عمود وقت الدخول في النتائج الموجودة مسبقًا.
  try{
    if(typeof renderResults === 'function'){
      setTimeout(function(){ renderResults(); }, 0);
    }
  }catch(e){
    console.warn('Journey login-time initial refresh:', e);
  }
})();
<\/script>
`;
    html=html.replace('</body>',loginTimePatch+'</body>');

    document.open();
    document.write(html);
    document.close();

  }catch(error){
    const loader=document.getElementById('loader');
    loader.innerHTML=
      '<div><h2>تعذر فتح لوحة المعلم</h2>'+
      '<p class="muted">تأكد من اتصال الإنترنت ثم أعد المحاولة.</p>'+
      '<button onclick="location.reload()">إعادة المحاولة</button></div>';

    console.error('Teacher loader error:',error);
  }
})();
</script>

<noscript>يرجى تفعيل JavaScript لفتح لوحة المعلم.</noscript>
</body>
</html>
