<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7fbff">
<title>لوحة المعلم – نافس | V4</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f4f9ff}
#teacherFrame{position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff}
#boot{position:fixed;inset:0;display:grid;place-items:center;background:#f4f9ff;z-index:10;font-family:Tahoma,Arial,sans-serif;color:#17355f;text-align:center;padding:24px}
#boot.hide{display:none}
.box{background:#fff;border:1px solid #dceaf7;border-radius:22px;padding:24px;box-shadow:0 18px 50px #176bd51c;width:min(520px,90vw)}
.spin{width:42px;height:42px;border:5px solid #dbeaf7;border-top-color:#1979d5;border-radius:50%;margin:0 auto 14px;animation:s .8s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="boot"><div class="box"><div class="spin"></div><b>جاري فتح لوحة نافس المحدثة...</b></div></div>
<iframe id="teacherFrame" src="teacher-final-visual.html?v=20261003-v4-base"></iframe>
<script>
const patchCode="(function(){\n  'use strict';\n\n  function patchDomainLabels(){\n    document.querySelectorAll('select option[value=\"العلوم الفيزيائية\"]').forEach(function(op){\n      op.textContent='علوم الفيزياء والكيمياء';\n    });\n    document.querySelectorAll('.domain.physics h3').forEach(function(h){\n      h.textContent='⚡ علوم الفيزياء والكيمياء';\n    });\n  }\n\n  function resultMatchesTask(r,t){\n    const rid=String((r&&r.taskId)||'').trim();\n    const tid=String((t&&t.taskId)||'').trim();\n    if(rid && tid) return rid===tid;\n    const rt=String((r&&r.taskTitle)||'').trim();\n    const tt=String((t&&t.title)||'').trim();\n    return !rid && rt && tt && rt===tt;\n  }\n\n  function taskParticipantsList(task){\n    const rows=((dashboardData&&dashboardData.results)||[]).filter(function(r){\n      return resultMatchesTask(r,task);\n    });\n    const map=new Map();\n    rows.forEach(function(r){\n      const code=String(r.studentCode||'').trim();\n      const name=String(r.studentName||'').trim();\n      const key=code||name;\n      if(!key)return;\n      const x=map.get(key)||{\n        code:code,\n        name:name||code||'طالب',\n        className:String(r.className||'').trim(),\n        attempts:0,\n        lastPercent:null,\n        lastAt:''\n      };\n      x.attempts++;\n      const at=String(r.submittedAt||r.loginAt||'');\n      if(!x.lastAt || at>x.lastAt){\n        x.lastAt=at;\n        const p=Number(r.percent);\n        x.lastPercent=Number.isFinite(p)?Math.round(p):null;\n      }\n      map.set(key,x);\n    });\n    return [...map.values()].sort((a,b)=>String(a.name).localeCompare(String(b.name),'ar'));\n  }\n\n  function saveVisibleState(){\n    try{\n      if(typeof saveServerCache==='function'){\n        saveServerCache({\n          students:(dashboardData&&dashboardData.students)||[],\n          results:(dashboardData&&dashboardData.results)||[],\n          sessions:(dashboardData&&dashboardData.sessions)||[],\n          questionOverrides:(typeof bankOverrides!=='undefined'&&Array.isArray(bankOverrides))?bankOverrides:[],\n          tasks:Array.isArray(tasks)?tasks:[]\n        });\n      }\n    }catch(_e){}\n  }\n\n  async function setTaskStateV3(id,status){\n    if(!teacherKey())throw new Error('أدخل مفتاح المعلم أولًا.');\n    await jsonp({action:'setTaskStatus',key:teacherKey(),taskId:id,status:status},60000);\n    const t=tasks.find(x=>String(x.taskId)===String(id));\n    if(t)t.status=status;\n    renderTasks();\n    saveVisibleState();\n    if(typeof refreshData==='function')refreshData(true).catch(()=>{});\n  }\n\n  window.nafsV3ToggleTask=async function(id){\n    const t=tasks.find(x=>String(x.taskId)===String(id));\n    if(!t)return alert('التكليف غير موجود.');\n    const current=taskStatus(t);\n    const next=(current==='OPEN'||current==='SCHEDULED')?'CLOSED':'ACTIVE';\n    try{\n      await setTaskStateV3(id,next);\n      notice(next==='CLOSED'?'تم إيقاف التكليف بنجاح.':'تم تفعيل التكليف بنجاح.');\n    }catch(e){alert('تعذر تغيير حالة التكليف: '+e.message)}\n  };\n\n  window.nafsV3ArchiveTask=async function(id){\n    const t=tasks.find(x=>String(x.taskId)===String(id));\n    if(!t)return alert('التكليف غير موجود.');\n    if(!confirm('أرشفة التكليف «'+String(t.title||'تكليف')+'»؟'))return;\n    try{\n      await setTaskStateV3(id,'ARCHIVED');\n      notice('تمت أرشفة التكليف.');\n    }catch(e){alert('تعذر أرشفة التكليف: '+e.message)}\n  };\n\n  window.nafsV3DeleteTask=async function(id){\n    if(!teacherKey())return alert('أدخل مفتاح المعلم أولًا.');\n    const t=tasks.find(x=>String(x.taskId)===String(id));\n    if(!t)return alert('التكليف غير موجود.');\n    if(!confirm('حذف التكليف «'+String(t.title||'تكليف')+'» نهائيًا؟'))return;\n    try{\n      await jsonp({action:'deleteTask',key:teacherKey(),taskId:id},60000);\n      tasks=tasks.filter(x=>String(x.taskId)!==String(id));\n      renderTasks();\n      saveVisibleState();\n      notice('تم حذف التكليف بنجاح.');\n      if(typeof refreshData==='function')refreshData(true).catch(()=>{});\n    }catch(e){alert('تعذر حذف التكليف: '+e.message)}\n  };\n\n  window.nafsV3Participants=function(id){\n    const t=tasks.find(x=>String(x.taskId)===String(id));\n    if(!t)return alert('التكليف غير موجود.');\n    const list=taskParticipantsList(t);\n    const rows=list.map((p,i)=>`<tr>\n      <td>${i+1}</td>\n      <td>${esc(p.name)}</td>\n      <td>${esc(p.className||'—')}</td>\n      <td>${p.attempts}</td>\n      <td>${p.lastPercent==null?'—':p.lastPercent+'%'}</td>\n      <td>${esc(p.lastAt?fmtDate(p.lastAt):'—')}</td>\n    </tr>`).join('');\n    openModal('المشاركون — '+String(t.title||'تكليف'),`\n      <div class=\"helper\"><b>عدد المشاركين:</b> ${list.length} طالبًا • <b>الفصل:</b> ${esc(t.className||'—')}</div>\n      <div class=\"bank-table-wrap\" style=\"margin-top:10px\">\n        <table>\n          <thead><tr><th>#</th><th>الطالب</th><th>الفصل</th><th>المحاولات</th><th>آخر نسبة</th><th>آخر مشاركة</th></tr></thead>\n          <tbody>${rows||'<tr><td colspan=\"6\" style=\"text-align:center\">لا توجد مشاركات مسجلة لهذا التكليف حتى الآن.</td></tr>'}</tbody>\n        </table>\n      </div>`);\n  };\n\n  renderTasks=function(){\n    const box=document.getElementById('tasksList');if(!box)return;\n    if(!tasks.length){\n      box.innerHTML='<div class=\"warning-box\">لا توجد تكليفات محمّلة. أدخل مفتاح المعلم واضغط «تحديث البيانات».</div>';\n      return;\n    }\n    box.innerHTML=tasks.map(t=>{\n      const id=String(t.taskId||'');\n      const idq=JSON.stringify(id);\n      const s=taskStatus(t);\n      const participants=taskParticipantsList(t).length;\n      const active=(s==='OPEN'||s==='SCHEDULED');\n      return `<div class=\"task-card\">\n        <h4>${esc(t.title||'تكليف')}</h4>\n        <div class=\"task-meta\">\n          <span>الفصل ${esc(t.className||'')}</span>\n          <span>• ${(t.questionIds||[]).length} سؤالًا</span>\n          <span>• ${esc(s)}</span>\n          <span>• ${esc(t.type||'training')}</span>\n          <span>• ${participants} مشارك</span>\n        </div>\n        <div style=\"margin-top:10px;display:flex;gap:7px;flex-wrap:wrap\">\n          <button class=\"btn-mini btn-edit\" onclick='editTaskById(${idq})'>✏️ تعديل</button>\n          <button class=\"btn-mini ${active?'btn-hide':'btn-view'}\" onclick='nafsV3ToggleTask(${idq})'>${active?'⏸ إيقاف':'▶️ تفعيل'}</button>\n          <button class=\"btn-mini btn-view\" onclick='nafsV3Participants(${idq})'>👥 المشاركون (${participants})</button>\n          <button class=\"btn-mini btn-view\" onclick='nafsV3ArchiveTask(${idq})'>📦 أرشفة</button>\n          <button class=\"btn-mini btn-hide\" onclick='nafsV3DeleteTask(${idq})'>🗑 حذف</button>\n        </div>\n      </div>`;\n    }).join('');\n  };\n\n  const oldOpenTaskEditor=openTaskEditor;\n  openTaskEditor=function(){\n    const r=oldOpenTaskEditor.apply(this,arguments);\n    setTimeout(patchDomainLabels,0);\n    setTimeout(patchDomainLabels,120);\n    return r;\n  };\n\n  function markV3(){\n    const sec=document.getElementById('assignments');\n    if(sec && !document.getElementById('nafsV3Badge')){\n      const b=document.createElement('div');\n      b.id='nafsV3Badge';\n      b.className='helper';\n      b.style.marginBottom='12px';\n      b.innerHTML='<b>✓ إدارة التكليفات المحدثة:</b> تعديل • إيقاف/تفعيل • المشاركون • أرشفة • حذف';\n      const head=sec.querySelector('.section-head');\n      if(head)head.insertAdjacentElement('afterend',b);\n    }\n  }\n\n  patchDomainLabels();\n  markV3();\n  try{renderTasks();}catch(_e){}\n  setTimeout(()=>{patchDomainLabels();markV3();try{renderTasks();}catch(_e){}},400);\n})();\n\n(function(){\n  'use strict';\n\n  function taskUnitMatches(q,unit){\n    if(!unit)return true;\n    if(unit==='الفيزياء والكيمياء'){\n      return q.lesson==='الفيزياء' || q.lesson==='الكيمياء';\n    }\n    return q.lesson===unit;\n  }\n\n  function rebuildTaskUnitOptions(){\n    const unit=document.getElementById('tpUnit');\n    const domain=document.getElementById('tpDomain');\n    if(!unit||!domain)return;\n\n    let previous=unit.value||'';\n    if(previous==='الفيزياء'||previous==='الكيمياء')previous='الفيزياء والكيمياء';\n\n    let opts=[{v:'',t:'كل وحدات المجال'}];\n\n    if(domain.value==='علوم الحياة'){\n      opts.push({v:'الأحياء',t:'الأحياء'});\n    }else if(domain.value==='العلوم الفيزيائية'){\n      opts.push({v:'الفيزياء والكيمياء',t:'الفيزياء والكيمياء'});\n    }else if(domain.value==='علوم الأرض والفضاء'){\n      opts.push({v:'تغيرات الأرض',t:'تغيرات الأرض'});\n    }else{\n      opts.push(\n        {v:'الأحياء',t:'الأحياء'},\n        {v:'الفيزياء والكيمياء',t:'الفيزياء والكيمياء'},\n        {v:'تغيرات الأرض',t:'تغيرات الأرض'}\n      );\n    }\n\n    unit.innerHTML=opts.map(o=>'<option value=\"'+o.v+'\">'+o.t+'</option>').join('');\n    const allowed=opts.map(o=>o.v);\n    unit.value=allowed.includes(previous)?previous:'';\n  }\n\n  window.syncTaskOutcome=function(){\n    rebuildTaskUnitOptions();\n\n    const sel=document.getElementById('tpOutcome');\n    if(!sel)return;\n\n    const current=sel.value;\n    const domain=document.getElementById('tpDomain')?.value||'';\n    const unit=document.getElementById('tpUnit')?.value||'';\n    const map=new Map();\n\n    taskQuestionPool()\n      .filter(q=>(!domain||q.domain===domain) && taskUnitMatches(q,unit))\n      .forEach(q=>{\n        if(q.outcomeCode)map.set(q.outcomeCode,q.outcomeTitle);\n      });\n\n    sel.innerHTML='<option value=\"\">كل نواتج التعلم</option>'+\n      [...map.entries()].sort().map(([c,t])=>\n        '<option value=\"'+esc(c)+'\">'+esc(c)+' — '+esc(t)+'</option>'\n      ).join('');\n\n    if([...map.keys()].includes(current))sel.value=current;\n    else sel.value='';\n  };\n\n  window.currentTaskFiltered=function(){\n    const domain=document.getElementById('tpDomain')?.value||'';\n    const unit=document.getElementById('tpUnit')?.value||'';\n    const outcome=document.getElementById('tpOutcome')?.value||'';\n    const level=document.getElementById('tpLevel')?.value||'';\n    const search=(document.getElementById('tpSearch')?.value||'').trim();\n\n    return taskQuestionPool().filter(q=>\n      (!domain||q.domain===domain) &&\n      taskUnitMatches(q,unit) &&\n      (!outcome||q.outcomeCode===outcome) &&\n      (!level||q.cognitiveLevel===level) &&\n      (!search||[q.text,q.outcomeTitle,q.outcomeCode].join(' ').includes(search))\n    );\n  };\n\n  const previousOpenTaskEditor=window.openTaskEditor;\n  if(typeof previousOpenTaskEditor==='function'){\n    window.openTaskEditor=function(){\n      const r=previousOpenTaskEditor.apply(this,arguments);\n      setTimeout(()=>{\n        rebuildTaskUnitOptions();\n        window.syncTaskOutcome();\n        if(typeof window.renderTaskPicker==='function')window.renderTaskPicker();\n      },160);\n      return r;\n    };\n  }\n\n  function markV4(){\n    const b=document.getElementById('nafsV3Badge');\n    if(b){\n      b.innerHTML='<b>✓ إدارة التكليفات المحدثة V4:</b> تعديل • إيقاف/تفعيل • المشاركون • أرشفة • حذف • دمج الفيزياء والكيمياء';\n    }\n  }\n\n  setTimeout(()=>{\n    rebuildTaskUnitOptions();\n    markV4();\n  },500);\n})();\n";
const frame=document.getElementById('teacherFrame');
const boot=document.getElementById('boot');
frame.addEventListener('load',function(){
  try{
    const d=frame.contentDocument;
    const s=d.createElement('script');
    s.type='text/javascript';
    s.textContent=patchCode;
    d.documentElement.appendChild(s);
    setTimeout(()=>boot.classList.add('hide'),120);
  }catch(e){
    boot.innerHTML='<div class="box"><b style="color:#9d2637">تعذر تفعيل تحسينات لوحة المعلم:</b><br><br>'+String(e.message)+'</div>';
  }
});
</script>
</body>
</html>
